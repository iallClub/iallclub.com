<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#10201C; --muted:#55635F; --faint:#8B9894; --line:#DCE2E0; --soft:#EEF3F1;
  --acc:#3FE0A8; --acc-ink:#06231B; --acc-dk:#0A6B50; --acc-bg:#E3F7EE;
  --warn:#F2A93B; --warn-ink:#8A5300; --warn-bg:#FFF1D6;
  --bad:#D64545; --bad-bg:#FDE7E7; --blue:#2F7FD1; --blue-bg:#E4EFFB; --vio:#6B5BD6; --vio-bg:#ECE9FB;
  --r:16px; --mono:'JetBrains Mono',ui-monospace,monospace; --disp:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc-dk)}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.4px;margin:0}
.mono{font-family:var(--mono)} .muted{color:var(--muted)} .small{font-size:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:1200}
header img{height:30px;border-radius:6px;background:#fff}
header h1{font-size:17px} header .sub{font-size:12px;color:#9FB3AD}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:54px;z-index:1199}
nav button{border:0;background:transparent;padding:8px 13px;border-radius:999px;white-space:nowrap;color:var(--muted);font-weight:500}
nav button.on{background:var(--ink);color:#fff}
nav .badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:4px}
main{max-width:1180px;margin:0 auto;padding:16px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cols>.card{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-family:var(--disp);font-size:28px;line-height:1.1}
.kpi i{font-style:normal;font-size:12px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.bad{color:var(--bad);border-color:#F1C4C4}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;width:100%}
input[type=color]{padding:2px;height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover{background:var(--soft)}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--acc-bg);color:var(--acc-dk)} .p-warn{background:var(--warn-bg);color:var(--warn-ink)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-mut{background:var(--soft);color:var(--muted)} .p-blue{background:var(--blue-bg);color:var(--blue)} .p-vio{background:var(--vio-bg);color:var(--vio)}
.empty{text-align:center;color:var(--faint);padding:26px 10px}
.li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--soft)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;transition:.25s;z-index:3000;max-width:90vw}
.toast.on{transform:translate(-50%,0)} .toast.err{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(16,32,28,.5);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow-y:auto}
.modal{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:660px}
.loading{min-height:60vh;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc-dk);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.kiosk{max-width:440px;margin:0 auto;text-align:center}
.clock{font-family:var(--disp);font-size:52px;font-weight:700;line-height:1}
.pick{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-top:6px}
.pick:hover{border-color:var(--acc-dk)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px 0;font-family:var(--disp);font-size:22px}
.pad button:active{background:var(--acc-bg)}
.dots{font-family:var(--mono);font-size:30px;letter-spacing:10px;height:40px}
.okbox{border-radius:20px;padding:26px 16px;color:#fff}
.okbox b{display:block;font-family:var(--disp);font-size:34px}
#qrbox svg{width:min(70vw,340px);height:auto}
.grid td,.grid th{padding:5px;text-align:center}
.grid td:first-child,.grid th:first-child{text-align:left;position:sticky;left:0;background:var(--card);min-width:150px;z-index:1}
.grid select{padding:6px 4px;font-size:12px;min-width:92px;border-radius:9px}
.grid td.cf select{outline:2px solid var(--bad)}
.cal td,.cal th{padding:2px;text-align:center;font-size:11px;min-width:22px}
.cal td:first-child,.cal th:first-child{text-align:left;position:sticky;left:0;background:var(--card);min-width:140px;font-size:13px}
.cal i{display:block;height:18px;border-radius:5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:#fff}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;overflow-x:auto;padding-top:18px}
.bars .g{flex:1;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .p{display:flex;align-items:flex-end;gap:3px;flex:1;width:100%;justify-content:center}
.bars .b{width:16px;border-radius:5px 5px 0 0;position:relative;min-height:2px}
.bars .b span{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.bars .x{font-size:11px;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bars.many{gap:4px} .bars.many .g{min-width:20px} .bars.many .b{width:8px} .bars.many .p{gap:2px}
.hb{height:8px;background:var(--soft);border-radius:9px;overflow:hidden} .hb>div{height:100%}
.demo{background:var(--warn-bg);color:var(--warn-ink);text-align:center;padding:6px;font-size:13px}
#map{height:400px;border-radius:12px;border:1px solid var(--line)}
@media(max-width:640px){ .hide-s{display:none} .clock{font-size:42px} }
@media print{ header,nav,.noprint{display:none!important} body{background:#fff} }
</style>

<script>
/* ============================================================
   RRHHApp · iall Club · v3
   Marcación (PIN · QR dinámico · GPS con geocercas) · Asistencia y banco de horas · Turnos rotativos y cobertura
   Legajos · Documentos con firma/acuse · Licencias con niveles de aprobación · Comunicación interna
   Sanciones · Entrega de materiales · Analytics · Portal del empleado (/app/rrhhapp/portal/)
   v3: Onboarding · Evaluación de desempeño 180°/360° · Visitas y contratistas · Importación de reloj biométrico
   Seguridad: RLS en Supabase + sesión de iall Club. Sin archivos en Storage: los documentos son links.
   ============================================================ */
const BUILD = '2026-11-11a';
const SUPABASE_URL = 'https://smldkvlmmzlgpxrtfesz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HGeSd7TgEqn53VUrltY-Tg_OW_ERXQ8';

const qs = new URLSearchParams(location.search);
const CID = qs.get('cid') || '';
const DEMO = !CID || CID === 'admin' || qs.get('demo') === '1';
let sb = null, SESSION_EMAIL = 'demo', EMP = {};
let VIEW = 'panel';
const T = { emp:'rrhh_empleados', turnos:'rrhh_turnos', plan:'rrhh_planificacion', marc:'rrhh_marcaciones', docs:'rrhh_documentos', aus:'rrhh_ausencias',
  sedes:'rrhh_sedes', pat:'rrhh_patrones', cob:'rrhh_cobertura', sanc:'rrhh_sanciones', banco:'rrhh_banco', avisos:'rrhh_avisos', leidos:'rrhh_avisos_leidos',
  buzon:'rrhh_buzon', enc:'rrhh_encuestas', resp:'rrhh_respuestas', part:'rrhh_encuesta_part', mat:'rrhh_materiales', ent:'rrhh_entregas',
  onbP:'rrhh_onb_plantillas', onb:'rrhh_onb', ciclos:'rrhh_eval_ciclos', evals:'rrhh_eval', hab:'rrhh_contratistas', acc:'rrhh_accesos' };
const D = { conPin:new Set(), cfg:{ niveles:1, nombres:['RRHH','Jefatura','Gerencia'], aprobadores:{}, max_lic_sector:null, descanso_min_h:12 } };
Object.keys(T).forEach(k => D[k] = []);
const DEMO_PIN = {};
console.log('%cRRHHApp BUILD ' + BUILD, 'color:#0A6B50;font-weight:bold', { CID, DEMO });

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const HOY = isoDate(new Date());
const dt = iso => new Date(iso + 'T12:00:00');
const addDays = (iso, n) => { const d = dt(iso); d.setDate(d.getDate() + n); return isoDate(d); };
const addMes = (ym, n) => { const d = new Date(+ym.slice(0,4), +ym.slice(5,7) - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const finMes = ym => isoDate(new Date(+ym.slice(0,4), +ym.slice(5,7), 0));
const fmtD = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '—';
const fmtDT = ts => ts ? new Date(ts).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const minsTs = ts => { const d = new Date(ts); return d.getHours()*60 + d.getMinutes(); };
const minsT = t => t ? (+t.slice(0,2))*60 + (+t.slice(3,5)) : 0;
const fechaTs = ts => isoDate(new Date(ts));
const daysTo = iso => iso ? Math.round((dt(iso) - dt(HOY)) / 86400000) : null;
const diasEntre = (a, b) => Math.round((dt(b) - dt(a)) / 86400000) + 1;
const byId = (arr, id) => arr.find(x => String(x.id) === String(id));
const hs = h => (Math.round(h*10)/10).toLocaleString('es-AR');
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'], MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const nomE = e => e ? `${e.apellido}, ${e.nombre}` : '—';
const nomId = id => nomE(byId(D.emp, id));
const activos = () => D.emp.filter(e => e.estado === 'activo').sort((a,b) => nomE(a).localeCompare(nomE(b)));
const sectores = () => [...new Set(D.emp.map(e => e.sector).filter(Boolean))].sort();
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
// Búsqueda por parte del texto: cada palabra escrita tiene que aparecer en algún lado ("cake" encuentra "cheesecake").
const coincide = (q, ...campos) => { const h = norm(campos.join(' ')); return norm(q).split(/\s+/).filter(Boolean).every(p => h.includes(p)); };
const limpio = o => { const r = {}; for (const k in o) r[k] = (o[k] === '' ? null : o[k]); return r; };
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', err ? 5000 : 2600);
}
const errMsg = e => (e && (e.message || e.error_description || e.details)) || String(e);
async function seguro(fn) { try { await fn(); } catch (e) { console.error(e); toast(errMsg(e), true); } }
function bajarCSV(nombre, filas) {
  const csv = '﻿' + filas.map(f => f.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' })); a.download = nombre; a.click();
}

const TIPOS_DOC = ['Recibo de sueldo','Contrato','Notificación','Reglamento interno','Libreta sanitaria','Carnet de manipulador','Apto médico / preocupacional','Capacitación BPM','Capacitación (otra)','Alta ARCA','ART / Seguro','Otro'];
const TIPOS_AUS = ['Vacaciones','Enfermedad','Accidente (ART)','Examen / estudio','Maternidad / paternidad','Matrimonio','Fallecimiento de familiar','Permiso sin goce','Compensación de horas','Otro'];
const TIPOS_SANC = ['Llamado de atención','Apercibimiento','Suspensión'];
const MOTIVOS_BAJA = ['Renuncia','Despido','Fin de contrato','Período de prueba','Jubilación','Otro'];
const CAT_MAT = ['EPP','Indumentaria','Herramienta','Equipo','Otro'];
const MET = { pin:['PIN','p-mut'], qr:['QR dinámico','p-vio'], gps:['Geolocalizada','p-warn'], manual:['Manual','p-blue'], reloj:['Reloj','p-ok'] };

function semaforo(vence) {
  const d = daysTo(vence);
  if (d === null) return { t:'Sin venc.', k:'p-mut', n:0 };
  if (d < 0) return { t:'Vencido', k:'p-bad', n:2 };
  if (d <= 30) return { t: d + ' días', k:'p-warn', n:1 };
  return { t:'Vigente', k:'p-ok', n:0 };
}

/* ============================================================
   DATOS
   ============================================================ */
let DESDE = addDays(HOY, -62);   // marcaciones y planificación se cargan desde esta fecha
async function todo(fn) {         // trae todas las filas (Supabase devuelve de a 1000)
  let out = [], i = 0;
  for (;;) { const { data, error } = await fn().order('id').range(i, i + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) break; i += 1000; }
  return out;
}
const sel = k => sb.from(T[k]).select('*').eq('cliente_id', CID);
async function cargarRango() {
  const [p, m] = await Promise.all([ todo(() => sel('plan').gte('fecha', DESDE)), todo(() => sel('marc').gte('ts', DESDE + 'T00:00:00')) ]);
  D.plan = p; D.marc = m;
}
async function cargar() {
  if (DEMO) return demoSeed();
  const ks = Object.keys(T).filter(k => k !== 'plan' && k !== 'marc');
  const res = await Promise.all([ ...ks.map(k => todo(() => k === 'emp' ? sel(k).is('deleted_at', null) : k === 'acc' ? sel(k).gte('ingreso', addDays(HOY, -90) + 'T00:00:00') : sel(k))), sb.rpc('rrhh_con_pin'), sb.from('rrhh_config').select('*').eq('cliente_id', CID), cargarRango() ]);
  ks.forEach((k, i) => D[k] = res[i]);
  D.conPin = new Set((res[ks.length].data || []).map(x => (typeof x === 'string' ? x : x.rrhh_con_pin)));
  const cfg = res[ks.length + 1].data; if (cfg && cfg[0]) Object.assign(D.cfg, cfg[0]);
}
async function asegurarDesde(f) { if (!DEMO && f < DESDE) { DESDE = f; await cargarRango(); } }
async function refrescarHoy() {   // "en vivo": trae las marcas nuevas del día sin recargar todo
  if (DEMO || VIEW !== 'panel' || $('#ov').innerHTML) return;
  try { const { data } = await sel('marc').gte('ts', HOY + 'T00:00:00'); if (!data) return;
    const antes = D.marc.length; data.forEach(m => { const x = byId(D.marc, m.id); x ? Object.assign(x, m) : D.marc.push(m); });
    if (D.marc.length !== antes) render(); } catch (e) {}
}

async function ins(k, row) {
  row = limpio({ ...row, cliente_id: DEMO ? 'demo' : CID });
  if (DEMO) { row = { id: uid(), created_at: new Date().toISOString(), ...row }; D[k].push(row); return row; }
  const { data, error } = await sb.from(T[k]).insert(row).select().single(); if (error) throw error;
  D[k].push(data); return data;
}
async function insLote(k, rows) {
  rows = rows.map(r => limpio({ ...r, cliente_id: DEMO ? 'demo' : CID }));
  if (DEMO) { rows.forEach(r => D[k].push({ id: uid(), created_at: new Date().toISOString(), ...r })); return; }
  for (let i = 0; i < rows.length; i += 500) { const { data, error } = await sb.from(T[k]).insert(rows.slice(i, i + 500)).select(); if (error) throw error; D[k].push(...data); }
}
async function upd(k, id, patch) {
  patch = limpio(patch);
  if (!DEMO) { const { data, error } = await sb.from(T[k]).update(patch).eq('id', id).select().single(); if (error) throw error; patch = data; }
  Object.assign(byId(D[k], id), patch);
}
async function del(k, id) {
  if (!DEMO) { const { error } = await sb.from(T[k]).delete().eq('id', id); if (error) throw error; }
  D[k] = D[k].filter(x => x.id !== id);
}
async function guardarCfg(patch) {
  Object.assign(D.cfg, patch);
  if (!DEMO) { const { cliente_id, ...resto } = D.cfg; const { error } = await sb.from('rrhh_config').upsert({ cliente_id: CID, ...resto }); if (error) throw error; }
}

/* ---------- cálculo de asistencia ---------- */
// Arma las jornadas: cada entrada se empareja con la salida siguiente y cuenta para el día de la entrada.
function jornadas() {
  const J = {}, porEmp = {};
  D.marc.filter(m => !m.anulada).sort((a,b) => new Date(a.ts) - new Date(b.ts)).forEach(m => (porEmp[m.empleado_id] = porEmp[m.empleado_id] || []).push(m));
  for (const id in porEmp) {
    const ms = porEmp[id];
    for (let i = 0; i < ms.length; i++) {
      if (ms[i].tipo !== 'entrada') continue;
      const k = id + '|' + fechaTs(ms[i].ts);
      const j = J[k] = J[k] || { ent: ms[i].ts, sal: null, horas: 0, abierta: false };
      const s = ms[i+1] && ms[i+1].tipo === 'salida' ? ms[i+1] : null;
      if (s) { j.horas += (new Date(s.ts) - new Date(ms[i].ts)) / 3600000; j.sal = s.ts; j.abierta = false; i++; }
      else j.abierta = true;
    }
  }
  return J;
}
const durTurno = t => { const d = minsT(t.hora_hasta) - minsT(t.hora_desde); return (d <= 0 ? d + 1440 : d) / 60; };
const licDe = (empId, f) => D.aus.find(a => a.empleado_id === empId && a.estado === 'aprobada' && a.desde <= f && a.hasta >= f);
function planMap() { const P = {}; D.plan.forEach(p => P[p.empleado_id + '|' + p.fecha] = p); return P; }
const turnoDe = (P, empId, f) => { const p = P[empId + '|' + f]; return p && p.turno_id ? byId(D.turnos, p.turno_id) : null; };

// Estado de un empleado en un día: presente / ausente / licencia / franco / pendiente / sinplan
function diaInfo(e, f, J, P) {
  const j = J[e.id + '|' + f], p = P[e.id + '|' + f];
  const turno = p && p.turno_id ? byId(D.turnos, p.turno_id) : null;
  const r = { f, j, turno, estado:'sinplan', tarde:false, minTarde:0, extra:0, horas: j ? j.horas : 0, teo: turno ? durTurno(turno) : 0 };
  if (j) {
    r.estado = 'presente';
    if (turno) {
      const dif = minsTs(j.ent) - minsT(turno.hora_desde);
      r.tarde = dif > (turno.tolerancia_min || 0); if (r.tarde) r.minTarde = dif;
      if (!j.abierta) r.extra = Math.max(0, j.horas - durTurno(turno));
    }
    return r;
  }
  const lic = licDe(e.id, f);
  if (lic) { r.estado = 'licencia'; r.lic = lic; return r; }
  if (turno) {
    const ahora = new Date().getHours()*60 + new Date().getMinutes();
    r.estado = (f < HOY || (f === HOY && ahora > minsT(turno.hora_desde) + (turno.tolerancia_min || 0))) ? 'ausente' : 'pendiente';
  } else if (p) r.estado = 'franco';
  return r;
}

/* ---------- vacaciones (LCT art. 150: 14 / 21 / 28 / 35 días corridos según antigüedad al 31/12) ---------- */
function vacCorresponden(e, anio) {
  if (e.vac_dias_override != null) return e.vac_dias_override;
  if (!e.fecha_ingreso) return 0;
  const fin = `${anio}-12-31`; if (e.fecha_ingreso > fin) return 0;
  const corridos = diasEntre(e.fecha_ingreso, fin), antig = corridos / 365.25;
  if (antig < 0.5) return Math.floor(corridos * 5 / 7 / 20);   // 1 día cada 20 trabajados (estimado)
  return antig <= 5 ? 14 : antig <= 10 ? 21 : antig <= 20 ? 28 : 35;
}

function proximasFechas(dias) {

/* ============================================================
   TURNOS: grilla · patrones rotativos · cobertura mínima
   ============================================================ */
const lunesDe = f => addDays(f, -((dt(f).getDay() + 6) % 7));
function conflictos(fs, P) {
  const out = [], minDesc = (D.cfg.descanso_min_h || 12) * 60;
  activos().forEach(e => fs.forEach(f => {
    const t = turnoDe(P, e.id, f); if (!t) return;
    const lic = licDe(e.id, f); if (lic) out.push({ e, f, m: `Turno asignado en día de licencia (${lic.tipo})` });
    const ta = turnoDe(P, e.id, addDays(f, -1));
    if (ta) { const desc = minsT(t.hora_desde) + 1440 - (minsT(ta.hora_desde) + durTurno(ta) * 60);
      if (desc < minDesc) out.push({ e, f, m: `Solo ${hs(desc / 60)} h de descanso desde el turno anterior (mínimo ${D.cfg.descanso_min_h || 12})` }); }
    let n = 0; while (n < 8 && turnoDe(P, e.id, addDays(f, -n))) n++;
    if (n >= 7) out.push({ e, f, m: 'Más de 6 días seguidos sin franco' });
  }));
  return out;
}

  const tur = D.turnos.filter(t => t.activo), cf = conflictos(fs, P), cfSet = new Set(cf.map(c => c.e.id + '|' + c.f));

  const faltas = cob.reduce((s,x) => s + x.n.filter(n => n < x.r.minimo).length, 0);
  return `<div class="row" style="margin-bottom:8px"><span class="pill ${cf.length ? 'p-bad' : 'p-ok'}">${cf.length} conflicto${cf.length === 1 ? '' : 's'}</span>${D.cob.length ? `<span class="pill ${faltas ? 'p-warn' : 'p-ok'}">${faltas ? faltas + ' días bajo la cobertura mínima' : 'Cobertura mínima cumplida'}</span>` : ''}</div>
  <div class="scroll"><table class="grid"><tr><th>Empleado</th>${fs.map(f => `<th style="${f===HOY?'color:var(--acc-dk)':''}">${DIAS[dt(f).getDay()]} ${f.slice(8)}</th>`).join('')}</tr>

async function guardarPlanLote(rows) {    // rows: [{ empleado_id, fecha, turno_id }]

  if (DEMO) { rows.forEach(r => { const ex = D.plan.find(p => p.empleado_id === r.empleado_id && p.fecha === r.fecha); ex ? ex.turno_id = r.turno_id : D.plan.push({ id: uid(), ...r }); }); return; }
  for (let i = 0; i < rows.length; i += 500) {
    const { data, error } = await sb.from(T.plan).upsert(rows.slice(i, i + 500).map(r => ({ ...r, cliente_id: CID })), { onConflict: 'empleado_id,fecha' }).select(); if (error) throw error;
    data.forEach(r => { const ex = D.plan.find(p => p.empleado_id === r.empleado_id && p.fecha === r.fecha); ex ? Object.assign(ex, r) : D.plan.push(r); });
  }
}

const PILL_AUS = { pendiente:'p-warn', aprobada:'p-ok', rechazada:'p-bad' };
const nomNivel = n => (D.cfg.nombres || [])[n - 1] || 'Nivel ' + n;
const pillNivel = a => a.estado !== 'pendiente' ? `<span class="pill ${PILL_AUS[a.estado]}">${a.estado}</span>` : `<span class="pill p-warn">${D.cfg.niveles > 1 ? `Nivel ${a.nivel || 1}/${D.cfg.niveles} · ${esc(nomNivel(a.nivel || 1))}` : 'pendiente'}</span>`;
const puedeAprobar = a => { const l = ((D.cfg.aprobadores || {})[a.nivel || 1] || []); return DEMO || !l.length || l.includes(SESSION_EMAIL); };
const btnResolver = a => puedeAprobar(a) ? `<button class="btn sm pri" onclick="resolver('${a.id}','aprobada')">Aprobar</button><button class="btn sm bad" onclick="resolver('${a.id}','rechazada')">Rechazar</button>` : `<span class="small muted">Aprueba ${esc(nomNivel(a.nivel || 1))}</span>`;
function topeSector(a) {    // ¿aprobarla deja a demasiada gente del mismo sector de licencia a la vez?
  const max = D.cfg.max_lic_sector, e = byId(D.emp, a.empleado_id); if (!max || !e || !e.sector) return null;
  for (let f = a.desde; f <= a.hasta; f = addDays(f, 1)) {
    const otros = activos().filter(o => o.id !== e.id && o.sector === e.sector && licDe(o.id, f));
    if (otros.length >= max) return `El ${fmtD(f)} ya hay ${otros.length} persona(s) de ${e.sector} de licencia (${otros.map(nomE).join('; ')}). El máximo configurado es ${max}.`;
  }
  return null;
}
function resolver(id, accion) {
  seguro(async () => {
    const a = byId(D.aus, id), niv = a.nivel || 1, ahora = new Date().toISOString();
    if (!puedeAprobar(a)) throw new Error('Tu usuario no está habilitado para aprobar este nivel');
    const hist = [...(a.aprobaciones || []), { nivel: niv, por: SESSION_EMAIL, at: ahora, accion }];
    if (accion === 'rechazada') { await upd('aus', id, { estado:'rechazada', aprobaciones: hist, resuelto_por: SESSION_EMAIL, resuelto_at: ahora }); toast('Solicitud rechazada'); }
    else if (niv < D.cfg.niveles) { await upd('aus', id, { nivel: niv + 1, aprobaciones: hist }); toast(`Aprobada por ${nomNivel(niv)}; pasa a ${nomNivel(niv + 1)}`); }
    else { const tope = topeSector(a); if (tope && !confirm(tope + '\n\n¿Aprobar igual?')) return;
      await upd('aus', id, { estado:'aprobada', aprobaciones: hist, resuelto_por: SESSION_EMAIL, resuelto_at: ahora }); toast('Solicitud aprobada'); }
    render();
  });
}
function nuevaAusencia(id) {
  const a = id ? byId(D.aus, id) : { desde:HOY, hasta:HOY, estado:'pendiente' };
  const hist = id && (a.aprobaciones || []).length ? `<div class="small muted" style="margin-top:12px">${a.aprobaciones.map(h => `${esc(nomNivel(h.nivel))}: ${h.accion} por ${esc(h.por)} el ${fmtDT(h.at)}`).join('<br>')}</div>` : '';
  const extra = hist + (id ? `<button type="button" class="btn sm bad" style="margin-top:14px" onclick="borrar('aus','${id}','¿Eliminar esta licencia?')">Eliminar</button>` : '');
  modal(id ? 'Editar licencia' : 'Nueva licencia / vacaciones', [
    { n:'empleado_id', l:'Empleado', t:'select', o:optEmp(), req:true, full:true }, { n:'tipo', l:'Tipo', t:'select', o:TIPOS_AUS.map(x => [x, x]) },
    { n:'estado', l:'Estado', t:'select', o:[['pendiente','Pendiente de aprobación'],['aprobada','Aprobada'],['rechazada','Rechazada']] },
    { n:'desde', l:'Desde', t:'date', req:true }, { n:'hasta', l:'Hasta (inclusive)', t:'date', req:true }, { n:'motivo', l:'Motivo / observaciones', t:'textarea', full:true }
  ], a, async v => {
    if (v.hasta < v.desde) throw new Error('La fecha "hasta" no puede ser anterior a "desde"');
    const choca = D.aus.find(x => x.id !== id && x.empleado_id === v.empleado_id && x.estado !== 'rechazada' && x.desde <= v.hasta && x.hasta >= v.desde);
    if (choca) throw new Error(`Se superpone con otra licencia del mismo empleado (${choca.tipo}, ${fmtD(choca.desde)} al ${fmtD(choca.hasta)})`);
    if (v.estado === 'aprobada' && (!id || a.estado !== 'aprobada')) { const tope = topeSector(v); if (tope && !confirm(tope + '\n\n¿Guardar igual?')) return false; }
    if (v.estado !== 'pendiente' && (!id || a.estado !== v.estado)) { v.resuelto_por = SESSION_EMAIL; v.resuelto_at = new Date().toISOString(); }
    id ? await upd('aus', id, v) : await ins('aus', { ...v, nivel: 1, aprobaciones: [], origen: 'rrhh' });
  }, extra);
}

function metricas(ym) {
  const ini = ym + '-01', fin = finMes(ym), tope = fin < HOY ? fin : HOY, J = jornadas(), P = planMap(), fs = [];
  for (let f = ini; f <= tope; f = addDays(f, 1)) fs.push(f);
  const enSector = e => !CTX.anSector || e.sector === CTX.anSector;
  const dot = f => D.emp.filter(e => enSector(e) && (!e.fecha_ingreso || e.fecha_ingreso <= f) && (e.estado === 'activo' || (e.fecha_baja && e.fecha_baja > f))).length;
  const m = { plan:0, pres:0, tarde:0, hTeo:0, hTrab:0, hAus:0, sect:{} };
  D.emp.filter(enSector).forEach(e => fs.forEach(f => {
    if ((e.fecha_ingreso && f < e.fecha_ingreso) || (e.fecha_baja && f > e.fecha_baja)) return;
    const d = diaInfo(e, f, J, P), s = m.sect[e.sector || 'Sin sector'] = m.sect[e.sector || 'Sin sector'] || { trab:0, teo:0 };
    m.hTrab += d.horas; s.trab += d.horas;
    if (!d.turno) return;
    m.plan++; m.hTeo += d.teo; s.teo += d.teo;
    if (d.estado === 'presente') { m.pres++; if (d.tarde) m.tarde++; }
    else if (d.estado === 'ausente' || (d.estado === 'licencia' && d.lic.tipo !== 'Vacaciones')) m.hAus += d.teo;
  }));
  const bajas = D.emp.filter(e => enSector(e) && e.fecha_baja && e.fecha_baja.slice(0,7) === ym).length, altas = D.emp.filter(e => enSector(e) && e.fecha_ingreso && e.fecha_ingreso.slice(0,7) === ym).length;
  const d0 = dot(ini), d1 = dot(tope);
  return { ...m, altas, bajas, dot: d1, aus: pct(m.hAus, m.hTeo), tar: pct(m.tarde, m.pres), rot: (d0 + d1) ? Math.round(bajas * 200 / (d0 + d1)) : 0 };
}
function barras(grupos, series) {    // grupos: [{ x, v:[n, n] }] · series: [[nombre, color]]
  const max = Math.max(1, ...grupos.flatMap(g => g.v));
  return `<div class="bars ${grupos.length > 8 ? 'many' : ''}">${grupos.map(g => `<div class="g"><div class="p">${g.v.map((n, i) => `<div class="b" style="height:${Math.round(n * 100 / max)}%;background:${series[i][1]}" title="${esc(series[i][0])}: ${hs(n)}"><span>${n ? hs(n) : ''}</span></div>`).join('')}</div><div class="x" title="${esc(g.x)}">${esc(g.x)}</div></div>`).join('')}</div>
    <div class="row small muted" style="margin-top:8px;justify-content:center">${series.map(([n, c]) => `<span><i class="dot" style="background:${c}"></i> ${n}</span>`).join('')}</div>`;
}
function vAnalytics() {

  const delta = (v, p, invert) => { const d = v - p; return d === 0 ? ' <i class="muted">= mes anterior</i>' : ` <i style="color:${(d > 0) === !!invert ? 'var(--acc-dk)' : 'var(--bad)'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)} pp</i>`; };

  const meses = Array.from({ length: 12 }, (_, i) => addMes(CTX.mes, i - 11));

  const sect = Object.entries(m.sect).filter(([, s]) => s.teo || s.trab).sort((x, y) => x[0].localeCompare(y[0]));

  const totC = Object.values(causas).reduce((s,n) => s + n, 0);

    <div class="small muted" style="margin-top:8px">Comparado contra ${MESES[+addMes(CTX.mes, -1).slice(5) - 1]} ${addMes(CTX.mes, -1).slice(0,4)} · calculado sobre las marcaciones y la planificación.</div></div>
  <div class="kpis">
    ${kpi(m.aus + '%', 'Ausentismo', 'var(--bad)', `<div class="small muted">Horas no trabajadas${delta(m.aus, a.aus)}</div>`)}
    ${kpi(m.tar + '%', 'Tardanza', 'var(--warn-ink)', `<div class="small muted">Sobre días presentes${delta(m.tar, a.tar)}</div>`)}
    ${kpi(m.rot + '%', 'Rotación', 'var(--blue)', `<div class="small muted">Egresos sobre dotación${delta(m.rot, a.rot)}</div>`)}
    ${kpi(m.dot, 'Cantidad de empleados', '', `<div class="small muted">Al cierre · ${m.altas} altas, ${m.bajas} bajas</div>`)}
    ${kpi(hs(prom('fecha_nac')) + ' años', 'Promedio de edad', '', '<div class="small muted">Valor actual</div>')}
    ${kpi(hs(prom('fecha_ingreso')) + ' años', 'Promedio antigüedad', '', '<div class="small muted">Valor actual</div>')}
  </div>

/* ============================================================
   IMPORTAR MARCACIONES DE UN RELOJ BIOMÉTRICO
   Acepta el archivo de registros del reloj (ZKTeco attlog .dat / .txt) o un CSV con: usuario, fecha y hora.
   ============================================================ */
let RELOJ = null;
function parseReloj(txt) {
  const out = [];
  String(txt).split(/\r?\n/).forEach(l => {
    let m = l.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[ T,;\t]+(\d{1,2}):(\d{2})(?::(\d{2}))?/), d;
    if (m) d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
    else { m = l.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})[ T,;\t]+(\d{1,2}):(\d{2})(?::(\d{2}))?/); if (!m) return; d = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +(m[6] || 0)); }
    const antes = l.slice(0, m.index).split(/[\t,; ]+/).filter(Boolean), desp = l.slice(m.index + m[0].length).split(/[\t,; ]+/).filter(Boolean), id = (antes[0] || '').replace(/["']/g, '');
    if (!id || isNaN(d)) return;
    let tipo = /salida|egreso|\bout\b/i.test(l) ? 'salida' : /entrada|ingreso|\bin\b/i.test(l) ? 'entrada' : null;
    if (!tipo && desp.length >= 2) tipo = ({ 0:'entrada', 1:'salida', 4:'entrada', 5:'salida' })[desp[1]] || null;     // columna de estado del attlog
    out.push({ id, d, tipo });
  });
  return out;
}

  RELOJ = null;
  ver('Importar marcaciones del reloj', `<p class="small muted">Subí el archivo de registros que exporta el reloj biométrico (ZKTeco <span class="mono">attlog.dat</span> / .txt) o un CSV con usuario, fecha y hora. Cada usuario del reloj se asocia al empleado por el campo "ID en el reloj" del legajo (si está vacío, por el número de legajo).</p>
    <label>Archivo</label><input type="file" id="relojFile" accept=".dat,.txt,.csv,.log" onchange="leerReloj()">
    <label>Entrada o salida</label><select id="relojModo" onchange="previaReloj()"><option value="alternar">Alternar por empleado y día (1ª marca entrada, 2ª salida…)</option><option value="reloj">Usar lo que indica el reloj / archivo</option></select>
    <div id="relojPrev" style="margin-top:12px"></div>`);
}

    if (RELOJ.length) await asegurarDesde(isoDate(new Date(Math.min(...RELOJ.map(x => +x.d))))); previaReloj(); }); r.readAsText(f);

  const grupos = {};
  (RELOJ || []).forEach(x => { const e = porId[sinCeros(x.id)]; if (!e) return sinEmp[x.id] = (sinEmp[x.id] || 0) + 1; (grupos[e.id + '|' + isoDate(x.d)] = grupos[e.id + '|' + isoDate(x.d)] || []).push({ ...x, e }); });

    rows.push({ empleado_id: x.e.id, tipo: modo === 'reloj' && x.tipo ? x.tipo : (g.slice(0, i).filter((y, k) => !k || y.d - g[k - 1].d >= 60000).length % 2 ? 'salida' : 'entrada'), ts: x.d.toISOString(), origen: 'reloj', metodo: 'reloj', creado_por: SESSION_EMAIL, anulada: false, fuera: false });

function editSede(id) {
  const s = id ? byId(D.sedes, id) : { radio_m: 150, activo: true };
  const extra = `<div class="row" style="margin-top:14px"><button type="button" class="btn sm" onclick="ubicarSede()">📍 Usar mi ubicación actual</button>${id ? `<button type="button" class="btn sm bad" onclick="borrar('sedes','${id}','¿Eliminar la sede? Las marcaciones quedan, sin sede asignada.')">Eliminar sede</button>` : ''}</div><p class="small muted">Parate en la entrada de la planta y tocá "Usar mi ubicación actual", o copiá latitud y longitud desde Google Maps.</p>`;
  modal(id ? 'Editar sede' : 'Nueva sede', [{ n:'nombre', l:'Nombre', req:true, full:true, ph:'Planta Norte' }, { n:'lat', l:'Latitud', t:'number', step:'any' }, { n:'lng', l:'Longitud', t:'number', step:'any' },
    { n:'radio_m', l:'Radio de la geocerca (m)', t:'number', req:true }, { n:'activo', l:'Activa', t:'select', o:SI_NO }], { ...s, activo: String(s.activo !== false) },
    async v => { v.activo = v.activo === 'true'; v.radio_m = +v.radio_m || 150; v.lat = v.lat === '' ? '' : +v.lat; v.lng = v.lng === '' ? '' : +v.lng;
      if (id) await upd('sedes', id, v); else { const n = await ins('sedes', v); if (!CTX.sede) CTX.sede = n.id; } }, extra);
}
function ubicarSede() {
  if (!navigator.geolocation) return toast('Este equipo no informa ubicación', true);
  navigator.geolocation.getCurrentPosition(p => { const f = $('.modal'); f.querySelector('[name=lat]').value = p.coords.latitude.toFixed(6); f.querySelector('[name=lng]').value = p.coords.longitude.toFixed(6); toast(`Ubicación tomada (precisión ${Math.round(p.coords.accuracy)} m)`); },
    e => toast('No se pudo obtener la ubicación: ' + e.message, true), { enableHighAccuracy: true, timeout: 15000 });
}
function guardarAprob(ev) {
  ev.preventDefault(); const v = Object.fromEntries(new FormData(ev.target).entries()), ap = {};
  [1,2,3].forEach(n => { const l = v['a' + n].split(',').map(s => s.trim().toLowerCase()).filter(Boolean); if (l.length) ap[n] = l; });
  seguro(async () => { await guardarCfg({ niveles: +v.niveles, nombres: [1,2,3].map(n => v['n' + n].trim() || 'Nivel ' + n), aprobadores: ap, max_lic_sector: v.max ? +v.max : null, descanso_min_h: +v.desc || 0 }); render(); toast('Configuración guardada'); });
}
