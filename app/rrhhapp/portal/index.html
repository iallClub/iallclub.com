<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10201C">
<title>Portal del empleado · iall Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#10201C; --muted:#55635F; --faint:#8B9894; --line:#DCE2E0; --soft:#EEF3F1;
  --acc:#3FE0A8; --acc-ink:#06231B; --acc-dk:#0A6B50; --acc-bg:#E3F7EE;
  --warn:#F2A93B; --warn-ink:#8A5300; --warn-bg:#FFF1D6; --bad:#D64545; --bad-bg:#FDE7E7; --blue:#2F7FD1; --blue-bg:#E4EFFB;
  --r:18px; --mono:'JetBrains Mono',ui-monospace,monospace; --disp:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.4px;margin:0}
a{color:var(--acc-dk)}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
#app{max-width:520px;margin:0 auto;padding:14px 14px 96px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--acc);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--disp);font-size:28px;line-height:1.1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:600;width:100%}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{width:auto;padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.big{font-size:19px;padding:18px;border-radius:18px}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--acc-bg);color:var(--acc-dk)} .p-warn{background:var(--warn-bg);color:var(--warn-ink)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-mut{background:var(--soft);color:var(--muted)} .p-blue{background:var(--blue-bg);color:var(--blue)}
.li{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--soft)}
.li:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.hb{height:10px;background:var(--soft);border-radius:9px;overflow:hidden} .hb>div{height:100%;background:var(--acc-dk)}
.empty{text-align:center;color:var(--faint);padding:20px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{flex:1;max-width:130px;border:0;background:transparent;padding:8px 2px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
nav button svg{display:block;margin:0 auto 3px}
nav button.on{color:var(--acc-dk);background:var(--acc-bg)}
nav .n{position:absolute;top:2px;right:22%;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,140px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)} .toast.err{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(16,32,28,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.login{min-height:92vh;display:flex;flex-direction:column;justify-content:center;gap:6px}
.okbox{border-radius:20px;padding:24px 16px;color:#fff;text-align:center;margin-bottom:12px}
.okbox b{display:block;font-family:var(--disp);font-size:40px}
.demo{background:var(--warn-bg);color:var(--warn-ink);text-align:center;padding:6px;font-size:13px;border-radius:10px;margin-bottom:10px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc-dk);border-radius:50%;animation:s 1s linear infinite;margin:40vh auto 0}
@keyframes s{to{transform:rotate(360deg)}}
.esc{display:flex;gap:6px} .esc button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 0;font-weight:600} .esc button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="ov"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Portal del empleado · RRHHApp · iall Club
   Funciona en el navegador del celular. Entra con legajo o DNI + PIN.
   No usa el login de iall Club: todo pasa por funciones rrhh_portal_* de Supabase,
   que solo devuelven los datos de la persona que inició sesión.
   Link: /app/rrhhapp/portal/?cid=<id del cliente>
   ============================================================ */
const BUILD = '2026-11-11a';
const SUPABASE_URL = 'https://smldkvlmmzlgpxrtfesz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HGeSd7TgEqn53VUrltY-Tg_OW_ERXQ8';
const qs = new URLSearchParams(location.search);
const CID = qs.get('cid') || '';
const DEMO = !CID || CID === 'demo';
let QR_PEND = qs.get('qr') ? { p_sede: qs.get('s'), p_qr: qs.get('qr') } : null;
let TOKEN = null, S = null, VIEW = 'inicio', SUB = '', RES = null;
console.log('Portal RRHH BUILD ' + BUILD, { DEMO });

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const HOY = isoDate(new Date());
const dt = iso => new Date(iso + 'T12:00:00');
const addDays = (iso, n) => { const d = dt(iso); d.setDate(d.getDate() + n); return isoDate(d); };
const fmtD = iso => iso ? String(iso).slice(0,10).split('-').reverse().join('/') : '—';
const fmtDT = ts => ts ? new Date(ts).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const minsTs = ts => { const d = new Date(ts); return d.getHours()*60 + d.getMinutes(); };
const minsT = t => t ? (+t.slice(0,2))*60 + (+t.slice(3,5)) : 0;
const fechaTs = ts => isoDate(new Date(ts));
const diasEntre = (a, b) => Math.round((dt(b) - dt(a)) / 86400000) + 1;
const hs = h => (Math.round(h*10)/10).toLocaleString('es-AR');
const hm = min => { min = Math.max(0, Math.round(min)); return pad(Math.floor(min / 60)) + ':' + pad(min % 60); };
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const TIPOS_AUS = ['Vacaciones','Enfermedad','Examen / estudio','Maternidad / paternidad','Matrimonio','Fallecimiento de familiar','Permiso sin goce','Compensación de horas','Otro'];
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', err ? 5000 : 2600); }
const ic = d => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

/* ---------- conexión ---------- */
async function api(fn, args) {
  if (DEMO) return demoApi(fn, args);
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:'POST', headers:{ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(args || {}) });
  const j = await r.json().catch(() => null);
  if (!r.ok) { const m = (j && (j.message || j.error)) || 'Error de conexión';
    if (String(m).includes('SESION_VENCIDA')) { salir(true); throw new Error('Tu sesión venció. Volvé a ingresar.'); }
    throw new Error(m); }
  return j;
}
async function accion(fn, args, okMsg) {     // llama, muestra el error si lo hay y recarga los datos
  try { const r = await api(fn, { p_token: TOKEN, ...args }); if (r && r.ok === false) { toast(r.error, true); return null; }
    await cargar(true); if (okMsg) toast(okMsg); return r || { ok: true }; }
  catch (e) { toast(e.message, true); return null; }
}
async function cargar(silencioso) {
  S = await api('rrhh_portal_datos', { p_token: TOKEN });
  if (!silencioso) render();
}
function salir(sinLlamar) { if (!sinLlamar && TOKEN && !DEMO) api('rrhh_portal_salir', { p_token: TOKEN }).catch(() => {}); TOKEN = null; S = null; ls.set('rrhh_tok_' + CID, null); VIEW = 'inicio'; SUB = ''; RES = null; cerrar(); render(); }

/* ---------- cálculos (solo con los datos propios) ---------- */
const turno = id => S.turnos.find(t => t.id === id);
const durTurno = t => { const d = minsT(t.hora_hasta) - minsT(t.hora_desde); return (d <= 0 ? d + 1440 : d) / 60; };
const planDe = f => S.plan.find(p => p.fecha === f);
const licDe = f => S.aus.find(a => a.estado === 'aprobada' && a.desde <= f && a.hasta >= f);
function jornadas() {
  const J = {}, ms = S.marc.slice().sort((a,b) => new Date(a.ts) - new Date(b.ts));
  for (let i = 0; i < ms.length; i++) { if (ms[i].tipo !== 'entrada') continue;
    const k = fechaTs(ms[i].ts), j = J[k] = J[k] || { ent: ms[i].ts, sal: null, horas: 0, abierta: false, ultEnt: ms[i].ts };
    j.ultEnt = ms[i].ts; const s = ms[i+1] && ms[i+1].tipo === 'salida' ? ms[i+1] : null;
    if (s) { j.horas += (new Date(s.ts) - new Date(ms[i].ts)) / 3600000; j.sal = s.ts; j.abierta = false; i++; } else j.abierta = true; }
  return J;
}
function dia(f, J) {
  const p = planDe(f), t = p && p.turno_id ? turno(p.turno_id) : null, j = J[f], lic = licDe(f);
  const r = { f, t, j, lic, estado: 'sinplan', tarde: false };
  if (j) { r.estado = 'presente'; if (t) r.tarde = minsTs(j.ent) - minsT(t.hora_desde) > (t.tolerancia_min || 0); }
  else if (lic) r.estado = 'licencia';
  else if (t) { const ahora = new Date().getHours()*60 + new Date().getMinutes(); r.estado = (f < HOY || (f === HOY && ahora > minsT(t.hora_desde) + (t.tolerancia_min || 0))) ? 'ausente' : 'pendiente'; }
  else if (p) r.estado = 'franco';
  return r;
}
function vacCorresponden(anio) {
  const e = S.empleado; if (e.vac_dias_override != null) return e.vac_dias_override; if (!e.fecha_ingreso) return 0;
  const fin = `${anio}-12-31`; if (e.fecha_ingreso > fin) return 0;
  const corridos = diasEntre(e.fecha_ingreso, fin), antig = corridos / 365.25;
  if (antig < 0.5) return Math.floor(corridos * 5 / 7 / 20);
  return antig <= 5 ? 14 : antig <= 10 ? 21 : antig <= 20 ? 28 : 35;
}
const anio = HOY.slice(0,4);
const diasAus = filtro => S.aus.filter(a => a.estado === 'aprobada' && String(a.desde).slice(0,4) === anio && filtro(a)).reduce((s,a) => s + diasEntre(a.desde, a.hasta), 0);
const pendientes = () => ({ firmas: S.docs.filter(d => d.requiere_firma && !d.firmado_at), sanc: S.sanciones.filter(s => !s.acuse_at), ent: S.entregas.filter(x => !x.acuse_at && !x.devuelto_at), avisos: S.avisos.filter(a => !a.leido), enc: S.encuestas, evals: S.evals || [],
  onb: (S.onb || []).filter(o => !o.cerrado_at).flatMap(o => (o.items || []).map((it, i) => ({ o, it, i })).filter(x => x.it.e && !x.it.hecho)) });

/* ============================================================
   PANTALLAS
   ============================================================ */
function render() {
  if (!TOKEN || !S) return $('#app').innerHTML = vLogin();
  const p = pendientes(), nd = p.firmas.length + p.sanc.length + p.ent.length, nm = p.avisos.length + p.enc.length + p.evals.length + p.onb.length;
  const nav = [['inicio','Inicio','<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',0],['jornada','Jornada','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',0],
    ['docs','Documentos','<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',nd],['mas','Más','<path d="M4 7h16M4 12h16M4 17h16"/>',nm]];
  $('#app').innerHTML = (DEMO ? '<div class="demo">Modo demo — datos de ejemplo</div>' : '') + ({ inicio: vInicio, jornada: vJornada, docs: vDocs, mas: vMas })[VIEW]()
    + `<nav>${nav.map(([k,l,d,n]) => `<button class="${VIEW===k?'on':''}" onclick="ir('${k}')">${ic(d)}${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</nav>`;
}
function ir(v, sub) { VIEW = v; SUB = sub || ''; RES = null; render(); window.scrollTo(0,0); }
function vLogin() {
  return `<div class="login"><div class="eyebrow">Portal del empleado</div><h1 style="font-size:30px;margin-bottom:8px">Ingresá con tu legajo o DNI</h1>
    ${DEMO ? '<div class="demo">Modo demo — entrá con cualquier dato</div>' : ''}
    ${QR_PEND ? '<div class="card" style="background:var(--acc-bg);border-color:var(--acc)">Escaneaste el QR de la planta: al ingresar se registra tu marcación.</div>' : ''}
    <form onsubmit="entrar(event)"><label>Legajo o DNI</label><input name="u" inputmode="numeric" autocomplete="username" required>
      <label>PIN</label><input name="p" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" required>
      <button class="btn pri big" style="margin-top:18px">Ingresar</button></form>
    <p class="small muted" style="text-align:center;margin-top:16px">¿No tenés PIN o lo olvidaste? Pedilo en RRHH.</p></div>`;
}
async function entrar(ev) {
  ev.preventDefault(); const f = ev.target, b = f.querySelector('button'); b.disabled = true;
  try { const r = await api('rrhh_portal_login', { p_cliente: CID, p_usuario: f.elements.u.value.trim(), p_pin: f.elements.p.value.trim() });
    if (!r.ok) { toast(r.error, true); b.disabled = false; return; }
    TOKEN = r.token; ls.set('rrhh_tok_' + CID, TOKEN); await cargar(); marcarQRPendiente();
  } catch (e) { toast(e.message, true); b.disabled = false; }
}
function vInicio() {
  const e = S.empleado, h = new Date().getHours(), J = jornadas(), d = dia(HOY, J), p = pendientes();
  const ult = S.marc.slice().sort((a,b) => new Date(b.ts) - new Date(a.ts))[0], adentro = ult && ult.tipo === 'entrada' && Date.now() - new Date(ult.ts) < 16 * 3600000;
  const u30 = Array.from({ length: 30 }, (_, i) => dia(addDays(HOY, -i - 1), J));
  let prog = '';
  if (d.t) { const total = durTurno(d.t) * 60, hecho = d.j ? d.j.horas * 60 + (d.j.abierta ? (Date.now() - new Date(d.j.ultEnt)) / 60000 : 0) : 0;
    prog = `<div class="hb" style="margin:10px 0 6px"><div style="width:${Math.min(100, Math.round(hecho * 100 / total))}%"></div></div>
      <div class="li" style="border:0;padding:0"><span class="grow small muted">${d.j ? 'Entrada ' + hhmm(d.j.ent) + (d.tarde ? ' · tarde' : '') : 'Todavía no marcaste'}</span><span class="small">${d.j && d.j.abierta ? 'Restan <b class="mono">' + hm(total - hecho) + '</b>' : d.j ? 'Trabajadas <b class="mono">' + hm(hecho) + '</b>' : ''}</span></div>`; }
  const prox = [1,2,3,4,5,6,7].map(i => addDays(HOY, i)).map(f => ({ f, p: planDe(f) })).find(x => x.p && x.p.turno_id);
  const acc = (n, txt, v, sub) => n ? `<div class="li" onclick="ir('${v}','${sub || ''}')" style="cursor:pointer"><span class="pill p-warn">${n}</span><span class="grow">${txt}</span><span class="muted">›</span></div>` : '';
  const tareas = acc(p.firmas.length, 'documento(s) para firmar', 'docs') + acc(p.sanc.length, 'notificación(es) para acusar', 'docs') + acc(p.ent.length, 'entrega(s) de materiales para confirmar', 'docs') + acc(p.avisos.length, 'aviso(s) sin leer en la cartelera', 'mas', 'cartelera') + acc(p.enc.length, 'encuesta(s) para responder', 'mas', 'encuestas')
    + acc(p.evals.length, 'evaluación(es) de desempeño para completar', 'mas', 'evals') + acc(p.onb.length, 'paso(s) de tu ingreso para confirmar', 'mas', 'onb');
  return `<div class="top"><div class="av">${esc((e.nombre[0] || '') + (e.apellido[0] || ''))}</div><div class="grow"><div class="small muted">${esc((S.empresa || {}).razon_social || '')}</div><h2>${h < 12 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches'}, ${esc(e.nombre.split(' ')[0])}</h2></div></div>
  ${RES ? `<div class="okbox" style="background:${RES.fuera ? 'var(--warn-ink)' : RES.tipo === 'entrada' ? 'var(--acc-dk)' : 'var(--ink)'}"><div class="eyebrow" style="color:#fff;opacity:.85">${RES.tipo === 'entrada' ? 'Entrada registrada' : 'Salida registrada'}</div><b>${hhmm(RES.ts)}</b>
      <div class="small" style="opacity:.9;margin-top:4px">${RES.metodo === 'qr' ? 'Con el QR de la planta' : RES.fuera ? `Fuera de la zona habilitada (${RES.dist_m} m). Queda señalada para RRHH.` : RES.dist_m != null ? 'Ubicación verificada' : 'Ubicación registrada'}</div></div>` : ''}
  <div class="card"><div class="li" style="border:0;padding:0"><div class="grow"><div class="eyebrow">Hoy · ${DIAS[dt(HOY).getDay()]} ${fmtD(HOY).slice(0,5)}</div><h3 style="margin-top:2px">${d.t ? esc(d.t.nombre) + ' <span class="mono small muted">' + d.t.hora_desde.slice(0,5) + '–' + d.t.hora_hasta.slice(0,5) + '</span>' : d.lic ? esc(d.lic.tipo) : d.estado === 'franco' ? 'Franco' : 'Sin turno asignado'}</h3></div></div>
    ${prog}<button class="btn ${adentro ? 'dark' : 'pri'} big" style="margin-top:14px" id="bmarcar" onclick="marcarGPS()">📍 Marcar ${adentro ? 'salida' : 'entrada'}</button>
    <div class="small muted" style="text-align:center;margin-top:8px">Usa la ubicación del celular. En la planta también podés escanear el QR.</div></div>
  ${tareas ? `<div class="card"><h3>Tenés pendiente</h3>${tareas}</div>` : ''}
  <div class="grid2"><div class="stat"><span class="small muted">Vacaciones restantes</span><b>${vacCorresponden(anio) - diasAus(a => a.tipo === 'Vacaciones')}</b></div>
    <div class="stat"><span class="small muted">Días de licencia ${anio}</span><b>${diasAus(a => a.tipo !== 'Vacaciones')}</b></div>
    <div class="stat"><span class="small muted">Llegadas tarde (30 d)</span><b>${u30.filter(x => x.tarde).length}</b></div>
    <div class="stat"><span class="small muted">Días sin justificar (30 d)</span><b style="${u30.filter(x => x.estado === 'ausente').length ? 'color:var(--bad)' : ''}">${u30.filter(x => x.estado === 'ausente').length}</b></div></div>
  ${prox ? `<div class="card"><div class="eyebrow">Próximo turno</div><b>${DIAS[dt(prox.f).getDay()]} ${fmtD(prox.f).slice(0,5)}</b> · ${esc((turno(prox.p.turno_id) || {}).nombre || '')} <span class="mono small muted">${((turno(prox.p.turno_id) || {}).hora_desde || '').slice(0,5)}</span></div>` : ''}
  ${S.cumples.length ? `<div class="card">🎂 Hoy cumple${S.cumples.length > 1 ? 'n' : ''} años: <b>${S.cumples.map(c => esc(c.nombre + ' ' + c.apellido)).join(', ')}</b></div>` : ''}`;

function marcarGPS() {

  if (fn === 'rrhh_portal_licencia') { DS.aus.unshift({ id:uid(), tipo:a.p_tipo, desde:a.p_desde, hasta:a.p_hasta, estado:'pendiente', motivo:a.p_motivo }); return ok; }
  if (fn === 'rrhh_portal_acusar') { const now = new Date().toISOString();
    if (a.p_tipo === 'aviso') DS.avisos.find(x => x.id === a.p_id).leido = true; else if (!/^\d{4,6}$/.test(a.p_pin || '')) return { ok:false, error:'PIN incorrecto' };
    else if (a.p_tipo === 'doc') DS.docs.find(x => x.id === a.p_id).firmado_at = now; else if (a.p_tipo === 'entrega') DS.entregas.find(x => x.id === a.p_id).acuse_at = now; return ok; }
  if (fn === 'rrhh_portal_evaluar') { DS.evals = DS.evals.filter(v => v.id !== a.p_eval); return ok; }
  if (fn === 'rrhh_portal_onb') { const o = DS.onb.find(x => x.id === a.p_onb); o.items[a.p_idx].hecho = true; if (o.items.every(i => i.hecho)) o.cerrado_at = new Date().toISOString(); return ok; }
  if (fn === 'rrhh_portal_responder') { DS.encuestas = DS.encuestas.filter(q => q.id !== a.p_encuesta); return ok; }
  return ok;
}

/* ---------- arranque ---------- */
(async function boot() {
  TOKEN = ls.get('rrhh_tok_' + CID);
  if (TOKEN) { try { await cargar(); marcarQRPendiente(); return; } catch (e) { TOKEN = null; ls.set('rrhh_tok_' + CID, null); } }
  render();
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden && TOKEN && S && !$('#ov').innerHTML && !document.querySelector('form.card')) cargar().catch(() => {}); });
</script>
