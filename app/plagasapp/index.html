<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlagasApp · iall Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#10201C; --muted:#55635F; --faint:#8B9894; --line:#DCE2E0; --soft:#EEF3F1;
  --acc:#3FE0A8; --acc-ink:#06231B; --acc-dk:#0A6B50; --acc-bg:#E3F7EE;
  --warn:#F2A93B; --warn-ink:#8A5300; --warn-bg:#FFF1D6;
  --bad:#D64545; --bad-bg:#FDE7E7; --blue:#2F7FD1;
  --r:18px; --mono:'JetBrains Mono',ui-monospace,monospace; --disp:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc-dk)}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.4px;margin:0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .small{font-size:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}

/* layout */
#app{min-height:100vh;display:flex}
.rail{display:none}
.main{flex:1;min-width:0;padding:20px 16px 110px;max-width:1180px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.brand-t{display:flex;flex-direction:column;min-width:0}
.brand-t b{font-family:var(--disp);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:4px;background:currentColor;display:inline-block}
.p-ok{background:var(--acc-bg);color:var(--acc-dk)} .p-warn{background:var(--warn-bg);color:var(--warn-ink)}
.p-bad{background:var(--bad-bg);color:#9B2323} .p-mut{background:var(--soft);color:var(--muted)} .p-ink{background:var(--ink);color:#fff}

/* bottom nav (mobile) */
.bnav{position:fixed;left:12px;right:12px;bottom:12px;background:#fff;border-radius:26px;padding:8px;display:grid;gap:4px;box-shadow:0 10px 30px rgba(16,32,28,.12);z-index:20}
.bnav a{height:54px;border-radius:18px;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px}
.bnav a.on{background:var(--ink);color:#fff}
.bnav a.on svg{stroke:var(--acc)}
@media (min-width:900px){
  .bnav{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;width:236px;flex:none;background:var(--ink);color:#fff;margin:16px 0 16px 16px;border-radius:28px;padding:22px 14px;position:sticky;top:16px;height:calc(100vh - 32px)}
  .rail .rb{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
  .rail a{height:46px;border-radius:14px;padding:0 12px;display:flex;align-items:center;gap:10px;color:#C9D4D0;text-decoration:none;font-size:14px}
  .rail a.on{background:#fff;color:var(--ink)}
  .rail a .bd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--acc)}
  .rail a.on .bd{color:var(--acc-dk)}
  .main{padding:24px 28px 40px}
}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px}
.dark{background:var(--ink);color:#fff;border-radius:24px;padding:20px}
.dark .muted{color:#9FB3AD}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--disp);font-size:30px;letter-spacing:-1px;font-weight:600}
.kpi.ink{background:var(--ink);color:#fff} .kpi.ink .muted{color:#9FB3AD}
.kpi.w{background:var(--warn-bg);color:#5C3800}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-h h2{font-size:18px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border-radius:18px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .tx b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .tx span{font-size:12px;color:var(--muted)}
.tag{width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--acc-dk);flex:none;text-align:center;line-height:1.1}
.sep{border-top:1px solid #EEF1F0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:#fff;border-radius:18px;font-size:14px}

/* buttons */
.btn{height:46px;padding:0 18px;border-radius:15px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-family:var(--disp);font-weight:600}
.btn.bad{color:#9B2323;border-color:#F3C3C3}
.btn.sm{height:38px;padding:0 12px;border-radius:12px;font-size:13px}
.btn.big{height:56px;border-radius:18px;font-size:15px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* forms / modal */
.ov{position:fixed;inset:0;background:rgba(16,32,28,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px 24px}
@media (min-width:640px){ .ov{align-items:center;padding:20px} .modal{border-radius:28px} }
.modal h3{font-size:20px;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 12px;width:100%}
.fld textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.fld input[type=file]{padding:10px}
.fld .hint{font-size:12px;color:var(--muted)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:80;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1} .toast.err{background:#9B2323}
@media (min-width:900px){.toast{bottom:28px}}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid #EEF1F0;vertical-align:middle}
.tblw{overflow-x:auto;background:#fff;border-radius:18px;padding:6px}

/* map */
.map{position:relative;background:#fff;border-radius:24px;overflow:hidden;min-height:240px;background-image:radial-gradient(#D5DDDA 1px,transparent 1px);background-size:14px 14px}
.map img{width:100%;display:block;opacity:.92}
.map.pick{cursor:crosshair;outline:3px dashed var(--acc)}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:14px;border:2px solid #fff;font-family:var(--mono);font-size:9px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:5px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:5px;height:46px}
.bars div{flex:1;border-radius:4px}

/* técnico */
.prog{display:grid;gap:3px}
.prog div{height:6px;border-radius:3px;background:var(--line)}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.st{height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.st.cur{outline:3px solid var(--acc);outline-offset:1px}
.states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sbtn{height:62px;border-radius:18px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;padding:0 14px;text-align:left}
.sbtn i{width:12px;height:12px;border-radius:6px;flex:none}
.sbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sig{width:100%;height:170px;background:#fff;border:1px dashed #B9C4C0;border-radius:16px;touch-action:none;display:block}
.demo-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px dashed #B9C4C0;border-radius:16px;padding:8px 10px;margin-bottom:14px;font-size:12px}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);flex-direction:column;gap:10px}
.spin{width:26px;height:26px;border-radius:13px;border:3px solid var(--line);border-top-color:var(--ink);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
video.qr{width:100%;border-radius:18px;background:#000}
@media print{ .bnav,.rail,.demo-bar{display:none} }
</style>
</head>
<body>
<div id="app"><div class="main"><div class="loading"><div class="spin"></div>Cargando PlagasApp…</div></div></div>

<script>
/* ============================================================
   PlagasApp · iall Club
   Módulo para empresas de control de plagas.
   Perfiles: admin · tecnico · cliente  (tabla plagas_perfiles)

   v0.1 sin fotos: firma como SVG en la tabla, certificados e
   informes generados en el navegador (no ocupan Storage).
   ============================================================ */
const BUILD = '2026-10-26b';
const SUPABASE_URL = 'https://smldkvlmmzlgpxrtfesz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HGeSd7TgEqn53VUrltY-Tg_OW_ERXQ8';
const BUCKET = 'plagas';

const qs = new URLSearchParams(location.search);
const CID = qs.get('cid') || '';
let DEMO = !CID || CID === 'admin' || qs.get('demo') === '1';
let sb = null, SESSION_EMAIL = '';

let ROLE = 'admin';          // admin | tecnico | cliente
let ME = null;               // fila de plagas_perfiles del usuario
let EMP = {};                // datos de la empresa (tabla clientes de iall Club)
let VIEW = '';
let CTX = { filtro:'todo', agenda:'proximas', cli:null, cliTab:'datos', visita:null, est:null, mapEst:null, pick:null };
const D = { clientes:[], perfiles:[], asign:[], docs:[], productos:[], planos:[], estaciones:[], visitas:[], hallazgos:[], informes:[], pedidos:[], config:{}, cuentas:[], movs:[], cobOK:false };

console.log('%cPlagasApp BUILD ' + BUILD, 'color:#0A6B50;font-weight:bold', { CID, DEMO });

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const HOY = isoDate(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const fmtD = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '—';
const fmtDT = ts => ts ? new Date(ts).toLocaleString('es-AR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const daysTo = iso => iso ? Math.round((new Date(iso + 'T12:00:00') - new Date(HOY + 'T12:00:00')) / 86400000) : null;
const byId = (arr, id) => arr.find(x => String(x.id) === String(id));
const cliName = id => (byId(D.clientes, id) || {}).razon_social || '—';
const perName = id => (byId(D.perfiles, id) || {}).nombre || '—';
const DIAS = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'], MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', err ? 5000 : 2800);
}
function errMsg(e) { return (e && (e.message || e.error_description || e.details)) || String(e); }

const CATS = { habilitacion:'Habilitación', director_tecnico:'Director técnico', seguro:'Seguros / ART', capacitacion:'Capacitación del personal',
  ficha_tecnica:'Ficha técnica', fds:'Hoja de seguridad (FDS)', registro_producto:'Registro de producto', contrato:'Contrato',
  programa_mip:'Programa MIP', carnet:'Carnet de aplicador', otro:'Otro' };
const CAT_TAG = { habilitacion:'HAB', director_tecnico:'DT', seguro:'ART', capacitacion:'CAP', ficha_tecnica:'FT', fds:'FDS', registro_producto:'REG', contrato:'CTO', programa_mip:'MIP', carnet:'CRN', otro:'DOC' };
const GRUPOS = { todo:null, habilitaciones:['habilitacion','director_tecnico'], personal:['seguro','capacitacion','carnet'], productos:['ficha_tecnica','fds','registro_producto'], cliente:['contrato','programa_mip','otro'] };
const EST = {
  sin_actividad:{ l:'Sin actividad', c:'#10201C', f:'#fff' },
  consumo:      { l:'Consumo',       c:'#F2A93B', f:'#2A1A00' },
  captura:      { l:'Captura',       c:'#D64545', f:'#fff' },
  danada:       { l:'Dañada',        c:'#2F7FD1', f:'#fff' },
  faltante:     { l:'Faltante',      c:'#8B9894', f:'#fff' },
  reemplazada:  { l:'Reemplazada',   c:'#3FE0A8', f:'#06231B' }
};
const TIPO_EST = { ecc:'Estación de cebo', trampa_fisica:'Trampa física', lampara_uv:'Lámpara UV', monitoreo_rastreros:'Monitoreo rastreros' };
const ESTADO_VIS = { programada:['Programada','p-mut'], en_curso:['En curso','p-ok'], cerrada:['Cerrada','p-ink'], anulada:['Anulada','p-bad'] };

function semaforo(vence) {
  const d = daysTo(vence);
  if (d === null) return { t:'Sin venc.', k:'p-mut', n:0 };
  if (d < 0) return { t:'Vencido', k:'p-bad', n:2 };
  if (d <= 30) return { t: d + ' días', k:'p-warn', n:1 };
  return { t:'Vigente', k:'p-ok', n:0 };
}

/* ---------- íconos ---------- */
const I = {
  shield:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/>',
  check:'<path d="M9 12l2 2 4-4"/>',
  down:'<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  cert:'<circle cx="12" cy="9" r="5"/><path d="M9 13l-2 8 5-3 5 3-2-8"/>',
  doc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  map:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c1-4 4-6 7-6s6 2 7 6"/><path d="M16 4a3.5 3.5 0 010 7M18 14c2 1 3.5 3 4 6"/>',
  build:'<path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/>',
  flask:'<path d="M9 3h6v5l4 9a2 2 0 01-2 3H7a2 2 0 01-2-3l4-9z"/><path d="M7 14h10"/>',
  qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-7"/>',
  pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  id:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 10h4M14 14h3"/>',
  alert:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  zip:'<path d="M6 3h9l4 4v14H6z"/><path d="M11 7h2M11 10h2M11 13h2v3h-2z"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>'
};
const ic = (n, s = 18, col = 'currentColor', w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ============================================================
   CAPA DE DATOS — Supabase (con RLS) o memoria en modo demo
   ============================================================ */
const TBL = { clientes:'plagas_clientes', perfiles:'plagas_perfiles', asign:'plagas_asignaciones', docs:'plagas_documentos',
  productos:'plagas_productos', planos:'plagas_planos', estaciones:'plagas_estaciones', visitas:'plagas_visitas',
  hallazgos:'plagas_hallazgos', informes:'plagas_informes', pedidos:'plagas_pedidos', config:'plagas_config', mon:'plagas_monitoreos', apl:'plagas_aplicaciones',
  cuentas:'plagas_cuentas', movs:'plagas_movimientos' };
const MEM = {};   // tablas en memoria (demo)
// valores por defecto que en Supabase pone la base (DEFAULT de cada columna)
const DEMO_DEFAULTS = { visitas: { estado: 'programada', tipo: 'programada', tecnicos_apoyo: [] }, pedidos: { estado: 'nuevo', tipo: 'avistamiento' },

/* ---------- Storage (bucket privado, URLs firmadas) ---------- */
async function subirArchivo(file, carpeta) {
  if (!file) return null;
  if (file.size > 5 * 1024 * 1024) throw new Error('El archivo supera 5 MB. Comprimilo antes de subirlo.');
  if (DEMO) return { path: 'demo/' + file.name, size: file.size };
  const limpio = file.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_');
  const path = `${CID}/${carpeta}/${Date.now()}_${limpio}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert: false, contentType: file.type });
  if (error) throw error;
  return { path, size: file.size };
}
async function urlFirmada(path, segundos = 120) {
  if (!path) return null;
  if (DEMO) return null;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, segundos);
  if (error) throw error; return data.signedUrl;
}
/* ---------- imágenes (logo y firma del DT) ----------
   Se guardan como PNG reducido (máx. 800 px): pocos KB en Storage.
   Para el PDF se leen con URL firmada y se pasan a PNG en un canvas. */
const IMGC = {};
async function imagenPNG(path) {
  if (!path) return null;
  if (IMGC[path]) return IMGC[path];
  try {
    let src = path, obj = null;
    if (!path.startsWith('data:')) {
      const u = await urlFirmada(path, 300); if (!u) return null;
      obj = URL.createObjectURL(await (await fetch(u)).blob()); src = obj;
    }
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    if (obj) URL.revokeObjectURL(obj);
    return (IMGC[path] = { data: c.toDataURL('image/png'), w: c.width, h: c.height });
  } catch (e) { console.warn('No se pudo leer la imagen', path, e); return null; }
}
async function archivoAPNG(origen, maxW = 800) {
  let canvas = origen;
  if (!(origen instanceof HTMLCanvasElement)) {
    const url = URL.createObjectURL(origen);
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('El archivo no es una imagen válida')); i.src = url; });
    const k = Math.min(1, maxW / img.naturalWidth);
    canvas = document.createElement('canvas'); canvas.width = Math.round(img.naturalWidth * k); canvas.height = Math.round(img.naturalHeight * k);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height); URL.revokeObjectURL(url);
  }
  const blob = await new Promise(ok => canvas.toBlob(ok, 'image/png'));
  return { blob, dataURL: canvas.toDataURL('image/png') };
}
async function subirImagen(origen, nombre) {
  const { blob, dataURL } = await archivoAPNG(origen);
  if (DEMO) return dataURL;
  const up = await subirArchivo(new File([blob], nombre + '.png', { type: 'image/png' }), 'empresa');
  return up.path;
}

/* ---------- SVG: logo y firma en vectores (nítidos con cualquier zoom) ---------- */
// Limpia un SVG subido: sin scripts, sin eventos, sin contenido externo.
function limpiarSVG(txt) {
  if (!txt || txt.length > 400000) throw new Error('El SVG está vacío o es demasiado grande (máx. 400 KB).');
  const d = new DOMParser().parseFromString(txt, 'image/svg+xml'), svg = d.documentElement;
  if (!svg || svg.nodeName.toLowerCase() !== 'svg' || d.querySelector('parsererror')) throw new Error('El archivo no es un SVG válido.');
  svg.querySelectorAll('script,foreignObject,iframe,image,use[href^="http"],a').forEach(n => n.remove());
  [svg, ...svg.querySelectorAll('*')].forEach(n => [...n.attributes].forEach(a => {
    if (/^on/i.test(a.name) || /javascript:|data:text/i.test(a.value) || (/href$/i.test(a.name) && !a.value.startsWith('#'))) n.removeAttribute(a.name);
  }));
  if (!svg.getAttribute('viewBox')) {
    const w = parseFloat(svg.getAttribute('width')), h = parseFloat(svg.getAttribute('height'));
    if (!w || !h) throw new Error('El SVG no tiene viewBox ni medidas.');
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  }
  svg.removeAttribute('width'); svg.removeAttribute('height');
  return new XMLSerializer().serializeToString(svg);
}
const svgURI = t => 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(t)));
function svgMedidas(t) { const m = /viewBox="([^"]+)"/.exec(t || ''); const v = m ? m[1].trim().split(/[\s,]+/).map(Number) : [0, 0, 100, 100]; return { w: v[2] || 100, h: v[3] || 100 }; }
// Dibuja un SVG dentro de una caja del PDF, sin deformarlo. align: left | center | right
async function pdfSVG(doc, txt, x, y, w, h, align = 'center', opacidad) {
  if (!txt || typeof doc.svg !== 'function') return false;
  const { w: vw, h: vh } = svgMedidas(txt), k = Math.min(w / vw, h / vh), iw = vw * k, ih = vh * k;
  const ox = align === 'left' ? x : align === 'right' ? x + w - iw : x + (w - iw) / 2;
  const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-9999px;top:0;width:10px;height:10px;overflow:hidden';
  host.innerHTML = txt; document.body.appendChild(host);
  const el = host.querySelector('svg');
  if (opacidad != null) el.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line').forEach(n => { n.setAttribute('fill-opacity', opacidad); n.setAttribute('stroke-opacity', opacidad); });
  try { await doc.svg(el, { x: ox, y: y + (h - ih) / 2, width: iw, height: ih }); return true; }
  catch (e) { console.warn('svg2pdf', e); return false; }
  finally { host.remove(); }
}
// Firma dibujada con el dedo → SVG vectorial recortado a lo dibujado
function trazosASVG(trazos, color = '#1F2F8F', grosor = 4) {
  const pts = trazos.filter(t => t.length > 1); if (!pts.length) return null;
  const all = pts.flat(), xs = all.map(p => p[0]), ys = all.map(p => p[1]), m = grosor * 2;
  const x0 = Math.min(...xs) - m, y0 = Math.min(...ys) - m, w = Math.max(...xs) - x0 + m, h = Math.max(...ys) - y0 + m;
  const d = pts.map(t => 'M' + t.map(p => p.map(n => Math.round(n * 10) / 10).join(' ')).join('L')).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${Math.round(x0)} ${Math.round(y0)} ${Math.round(w)} ${Math.round(h)}"><path d="${d}" fill="none" stroke="${color}" stroke-width="${grosor}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const leerTexto = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsText(f); });
const esSVG = f => f && (f.type === 'image/svg+xml' || /\.svg$/i.test(f.name));

    else if (f.type === 'file') input = `<input type="file" id="${id}" accept="${f.accept || 'application/pdf,image/*'}">`;

    return `<div class="fld" id="w_${f.k}"${f.hide ? ' style="display:none"' : ''}><label for="${id}">${f.label}${f.req ? ' *' : ''}</label>${input}${f.hint ? `<span class="hint">${f.hint}</span>` : ''}</div>`;
  }).join('');
}
function leer(fields) {
  const o = {};
  for (const f of fields) {
    const el = document.getElementById('f_' + f.k); if (!el) continue;
    if (f.type === 'file') { o[f.k] = el.files[0] || null; continue; }
    let v = el.value.trim();
    if (f.req && !v && el.closest('.fld').style.display !== 'none') { el.focus(); throw new Error(`Completá: ${f.label}`); }
    if (f.type === 'number') v = v === '' ? null : Number(v);
    o[f.k] = v === '' ? null : v;
  }
  return o;
}

async function carpetaAuditoria() {
  if (!window.JSZip) return toast('No se pudo cargar el compresor ZIP', true);
  toast('Armando la carpeta…');
  try {
    const zip = new JSZip(), pc = ME.plagas_cliente_id, nombre = cliName(pc);
    const docs = docsVisiblesCliente().filter(d => d.storage_path && semaforo(d.vence).n !== 2);
    let ok = 0;
    for (const d of docs) {
      if (DEMO) { zip.file(`01_Empresa/${d.nombre}.txt`, 'Modo demo: archivo de ejemplo'); continue; }
      try { const u = await urlFirmada(d.storage_path); const b = await (await fetch(u)).blob();
        const ext = (d.storage_path.split('.').pop() || 'pdf').toLowerCase();
        zip.file(`${d.alcance === 'cliente' ? '02_Contrato' : '01_Empresa'}/${CATS[d.categoria] || 'Otro'} - ${d.nombre}.${ext}`.replace(/[\\:*?"<>|]/g, '_'), b); ok++; } catch (_) {}
    }
    const desde = addDays(HOY, -365);
    const vs = D.visitas.filter(v => v.plagas_cliente_id === pc && v.estado === 'cerrada' && (v.fin || '').slice(0, 10) >= desde);

let FIRMA = [];
// Pad de firma reutilizable: devuelve una función que entrega el SVG dibujado (o null)
function padFirma(canvas, color = '#1F2F8F') {
  const ctx = canvas.getContext('2d'); let tr = [], on = false;
  const pos = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * canvas.width, (e.clientY - r.top) / r.height * canvas.height]; };
  const pintar = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = color;
    tr.forEach(t => { ctx.beginPath(); t.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); }); };
  canvas.addEventListener('pointerdown', e => { on = true; canvas.setPointerCapture(e.pointerId); tr.push([pos(e)]); });
  canvas.addEventListener('pointermove', e => { if (on) { tr[tr.length - 1].push(pos(e)); pintar(); } });
  canvas.addEventListener('pointerup', () => on = false);
  return { svg: () => trazosASVG(tr, color), borrar: () => { tr = []; pintar(); } };
}

  const padTec = $('#sigTecC') ? padFirma($('#sigTecC')) : null; if (padTec) $('#sigTecCclr').onclick = padTec.borrar;
  const c = $('#sig'), ctx = c.getContext('2d');
  const pos = e => { const r = c.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 300), Math.round((e.clientY - r.top) / r.height * 120)]; };
  let on = false;
  c.addEventListener('pointerdown', e => { on = true; c.setPointerCapture(e.pointerId); FIRMA.push([pos(e)]); });
  c.addEventListener('pointermove', e => { if (!on) return; FIRMA[FIRMA.length - 1].push(pos(e)); pintarFirma(); });
  c.addEventListener('pointerup', () => on = false);
  window.pintarFirma = () => { ctx.clearRect(0, 0, 600, 240); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#10201C';

}

/* ---------- Informe automático según las novedades detectadas ---------- */
const PRIO = { alta: 0, media: 1, baja: 2 };
function analizarVisita(v) {
  const est = D.estaciones.filter(e => e.plagas_cliente_id === v.plagas_cliente_id && e.activa);
  const mon = CACHE.mon[v.id] || [], apl = CACHE.apl[v.id] || [], hz = D.hallazgos.filter(h => h.visita_id === v.id);
  const de = k => mon.filter(m => m.estado === k).map(m => byId(D.estaciones, m.estacion_id)).filter(Boolean);
  const lista = arr => arr.map(e => e.codigo + (e.sector ? ` (${e.sector})` : '')).join(', ');
  const sectores = arr => [...new Set(arr.map(e => e.sector).filter(Boolean))].join(', ') || 'los sectores indicados';
  const cap = de('captura'), con = de('consumo'), dan = de('danada'), fal = de('faltante');
  const sinCtrl = est.filter(e => !mon.find(m => m.estacion_id === e.id));
  const nov = [];
  if (cap.length) nov.push({ n: 'alta', t: `Captura de roedores en ${lista(cap)}.`, r: `Indica presencia activa. Reforzar el monitoreo con frecuencia semanal hasta registrar dos controles seguidos sin actividad, y revisar y sellar posibles ingresos en ${sectores(cap)}.` });
  if (con.length) nov.push({ n: 'media', t: `Consumo de cebo en ${lista(con)}.`, r: `Se repuso el cebo. Verificar accesos, orden y fuentes de alimento o agua en ${sectores(con)}.` });
  if (dan.length || fal.length) nov.push({ n: 'media', t: [dan.length && `Estaciones dañadas: ${lista(dan)}`, fal.length && `Estaciones faltantes: ${lista(fal)}`].filter(Boolean).join('. ') + '.', r: 'Reponer las estaciones y evitar que se muevan o retiren durante la limpieza.' });
  if (sinCtrl.length) nov.push({ n: 'baja', t: `${sinCtrl.length} estación(es) sin controlar: ${lista(sinCtrl)}.`, r: 'Controlarlas en la próxima visita y registrar el motivo (área cerrada, acceso restringido, etc.).' });
  hz.forEach(h => nov.push({ n: h.prioridad || 'media', t: (h.sector ? h.sector + ': ' : '') + h.descripcion, r: [h.recomendacion, h.responsable && `Responsable: ${h.responsable}`].filter(Boolean).join('. ') + (h.recomendacion || h.responsable ? '.' : '') }));
  nov.sort((a, b) => PRIO[a.n] - PRIO[b.n]);
  const act = cap.length + con.length;
  const resumen = `Se controlaron ${mon.length} de ${est.length} estaciones. ` + (act ? `Se detectó actividad en ${act} estación(es).` : 'No se detectó actividad de roedores.')
    + (apl.length ? ` Se aplicaron ${apl.length} producto(s).` : '') + (hz.length ? ` Se registraron ${hz.length} hallazgo(s) en el establecimiento.` : '');
  const altas = nov.filter(x => x.n === 'alta').length;
  const prox = D.visitas.filter(x => x.plagas_cliente_id === v.plagas_cliente_id && x.estado === 'programada' && x.fecha_programada > (v.fin || HOY).slice(0, 10)).sort((a, b) => a.fecha_programada.localeCompare(b.fecha_programada))[0];
  const conclusiones = [
    cap.length ? 'Situación: actividad de roedores con capturas. Requiere acciones correctivas del establecimiento y refuerzo del servicio.'
      : con.length ? 'Situación: actividad baja de roedores (consumo de cebo). Se mantiene el programa con seguimiento de las estaciones con consumo.'
      : 'Situación: sin actividad de plagas en el monitoreo. Se mantiene el programa vigente.',
    altas ? `Hay ${altas} novedad(es) de prioridad alta que deben corregirse antes del próximo servicio.` : '',
    nov.length ? '' : 'Se recomienda mantener las condiciones de orden e higiene actuales.',
    prox ? `Próximo servicio programado: ${fmtD(prox.fecha_programada)}.` : ''
  ].filter(Boolean).join('\n');
  return { nov, resumen, conclusiones, est, mon, apl, hz, cap, con, dan, fal, sinCtrl };
}

function firmaSVG() {
  const d = FIRMA.filter(t => t.length > 1).map(t => 'M' + t.map(p => p.join(' ')).join('L')).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120"><path d="${d}" fill="none" stroke="#10201C" stroke-width="2" stroke-linecap="round"/></svg>`;
}
function trazosDeSVG(svg) {
  const m = /d="([^"]*)"/.exec(svg || ''); if (!m) return [];
  return m[1].split('M').filter(Boolean).map(s => s.split('L').map(p => p.trim().split(/\s+/).map(Number)));
}

/* ---------- escaneo de QR (BarcodeDetector, Chrome Android) ---------- */
async function escanearQR() {
  if (!('BarcodeDetector' in window)) return toast('Este celular no permite escanear desde la app. Tocá la estación en la grilla.', true);
  let stream;
  const ov = modal('Escanear estación', '<video class="qr" id="qrv" playsinline muted></video><p class="small muted">Apuntá al código QR de la estación.</p>', [{ label: 'Cancelar', fn: () => { stream && stream.getTracks().forEach(t => t.stop()); } }]);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const vid = $('#qrv'); vid.srcObject = stream; await vid.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const v = byId(D.visitas, CTX.visita);
    const loop = async () => {
      if (!document.body.contains(ov)) { stream.getTracks().forEach(t => t.stop()); return; }
      const codes = await det.detect(vid).catch(() => []);
      const raw = codes[0] && codes[0].rawValue;
      if (raw) {
        const tok = raw.replace(/^PLG:/, '');
        const e = D.estaciones.find(x => x.plagas_cliente_id === v.plagas_cliente_id && (x.qr_token === tok || x.codigo === tok));
        if (e) { stream.getTracks().forEach(t => t.stop()); cerrarModal(); CTX.est = e.id; render(); toast('Estación ' + e.codigo); return; }
        toast('Ese QR no es de este cliente', true);
      }
      setTimeout(loop, 250);
    };
    loop();
  } catch (e) { toast('No se pudo abrir la cámara: ' + errMsg(e), true); }
}

function programarVisita(opt = {}) {
  const v = opt.id ? byId(D.visitas, opt.id) : null, ped = opt.pedido ? byId(D.pedidos, opt.pedido) : null;
  const tecs = D.perfiles.filter(p => p.perfil === 'tecnico' && p.activo);
  if (!D.clientes.length) return toast('Primero cargá un cliente', true);
  const F = [{ k: 'plagas_cliente_id', label: 'Cliente', type: 'select', value: v ? v.plagas_cliente_id : ped ? ped.plagas_cliente_id : CTX.cli, options: D.clientes.filter(c => c.activo).map(c => [c.id, c.razon_social]) },
    { k: 'tecnico_id', label: 'Técnico responsable (cierra y firma)', type: 'select', value: v ? v.tecnico_id : '', options: [['', 'Sin asignar']].concat(tecs.map(t => { const s = semaforo(t.carnet_vence); return [t.id, t.nombre + (s.n === 2 ? ' (carnet vencido)' : '')]; })) },
    { k: 'fecha_programada', label: 'Fecha', type: 'date', req: true, value: v ? v.fecha_programada : HOY },
    { k: 'hora_programada', label: 'Hora', type: 'time', value: v ? (v.hora_programada || '').slice(0, 5) : '' },
    { k: 'tipo', label: 'Tipo', type: 'select', value: v ? v.tipo : ped ? 'extraordinaria' : 'programada', options: [['programada', 'Programada'], ['extraordinaria', 'Extraordinaria']] },
    { k: 'repetir', label: 'Repetir', type: 'select', hide: !!v, options: [['0', 'No repetir'], ['7', 'Semanal (12 semanas)'], ['14', 'Quincenal (6 meses)'], ['30', 'Mensual (12 meses)']] }];
  const ap = v ? apoyoDe(v) : [];
  const apoyoHTML = tecs.length > 1 ? `<div class="fld"><label>Técnicos de apoyo (opcional)</label><div class="states">
    ${tecs.map(t => `<label class="sbtn" style="cursor:pointer;height:52px"><input type="checkbox" class="apoyo" value="${t.id}" ${ap.includes(t.id) ? 'checked' : ''} style="width:20px;height:20px;accent-color:#10201C">${esc(t.nombre)}</label>`).join('')}</div>
    <span class="hint" style="font-size:12px;color:var(--muted)">Van a la misma visita y pueden registrar estaciones, productos y hallazgos. Quedan en el informe y en el historial del cliente; firma sólo el responsable.</span></div>` : '';
  modal(v ? 'Editar visita' : 'Programar visita', (ped ? `<div class="card" style="margin-bottom:12px"><b>Pedido:</b> ${esc(ped.descripcion)}</div>` : '') + form(F) + apoyoHTML, [CANCEL, { label: 'Guardar', cls: 'ink', fn: async () => {
    const o = leer(F); const rep = +(o.repetir || 0); delete o.repetir;
    if (!o.tecnico_id) o.tecnico_id = null; if (!o.hora_programada) o.hora_programada = null;
    o.tecnicos_apoyo = [...document.querySelectorAll('.apoyo:checked')].map(x => x.value).filter(id => id !== o.tecnico_id);
    if (o.tecnicos_apoyo.length && !o.tecnico_id) throw new Error('Elegí primero el técnico responsable');
    const conCarnet = id => { const t = byId(D.perfiles, id) || {}; return (t.nombre || '') + (t.carnet_numero ? ' · Carnet ' + t.carnet_numero : ''); };
    o.tecnico_nombre = o.tecnico_id ? (byId(D.perfiles, o.tecnico_id) || {}).nombre || null : null;
    o.tecnicos_apoyo_nombres = o.tecnicos_apoyo.map(conCarnet);
    for (const id of [o.tecnico_id, ...o.tecnicos_apoyo].filter(Boolean)) {
      const t = byId(D.perfiles, id);
      if (t.carnet_vence && t.carnet_vence < o.fecha_programada) throw new Error(`El carnet de ${t.nombre} vence el ${fmtD(t.carnet_vence)}: no se le puede asignar esta visita.`);
      await asegurarAsignacion(id, o.plagas_cliente_id);
    }
    if (v) { Object.assign(v, await dbUpdate('visitas', v.id, o)); toast('Visita actualizada'); }
    else {
      const n = rep ? { 7: 12, 14: 13, 30: 12 }[rep] : 1;
      for (let i = 0; i < n; i++) {
        const fe = rep === 30 ? (() => { const d = new Date(o.fecha_programada + 'T12:00'); d.setMonth(d.getMonth() + i); return isoDate(d); })() : addDays(o.fecha_programada, i * rep);
        D.visitas.push(await dbInsert('visitas', { ...o, fecha_programada: fe }));
      }
      if (ped) Object.assign(ped, await dbUpdate('pedidos', ped.id, { estado: 'asignado', visita_id: D.visitas[D.visitas.length - 1].id }));
      toast(n > 1 ? `${n} visitas programadas` : 'Visita programada');
    }
    render();
  } }]);
}

async function fnUsuarios(accion, datos = {}) {

    let m = error.message, st = error.context && error.context.status;

    if (st === 404 || /Failed to send a request/i.test(m)) m = 'Falta instalar la función “plagas-usuarios” en Supabase.';

/* ============================================================
   COBRANZAS — control de pagos de los clientes (NO es facturación).
   Cada cliente tiene una cuenta (plagas_cuentas: cómo paga) y movimientos
   (plagas_movimientos): cargos que suman deuda (abono, servicio, débito)
   y pagos/créditos que la descuentan. Los pagos se imputan a los cargos
   más viejos. Todo se calcula en el navegador: no ocupa Storage.
   Estados de un pago: ok (confirmado) · a_rendir (efectivo que tiene un
   técnico) · a_verificar (transferencia informada, falta ver el banco) · anulado.
   ============================================================ */
const MEDIOS = { efectivo: 'Efectivo', transferencia: 'Transferencia', cheque: 'Cheque', tarjeta: 'Tarjeta / billetera', otro: 'Otro' };
const TIPO_MOV = { cargo: 'Cargo', pago: 'Pago', credito: 'Crédito / bonificación', debito: 'Débito / ajuste' };
const EST_MOV = { ok: ['Confirmado', 'p-ok'], a_rendir: ['A rendir', 'p-warn'], a_verificar: ['A verificar', 'p-warn'], anulado: ['Anulado', 'p-mut'] };
const COND = { contado: 'Contado', cuenta_corriente: 'Cuenta corriente' };
const MODAL = { abono: 'Abono mensual', por_visita: 'Por visita' };
const TRAMOS = [['al_dia', 'A vencer', '#3FE0A8'], ['d30', '1–30 días', '#F2A93B'], ['d60', '31–60 días', '#E07B2E'], ['d90', '61–90 días', '#D64545'], ['mas', '+90 días', '#7A1E1E']];
const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DEBE = t => t === 'cargo' || t === 'debito';
const fmt$ = n => (n < -0.004 ? '− ' : '') + '$ ' + Math.abs(+n || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nroRecibo = m => m && m.numero ? 'R-' + String(m.numero).padStart(6, '0') : 'S/N';
const mesNombre = per => { const [y, m] = per.split('-'); return MESES_L[+m - 1] + ' ' + y; };
const sumar = (arr, f = m => +m.importe) => arr.reduce((s, m) => s + (f(m) || 0), 0);
// un pago cuenta para el saldo si está confirmado o si el efectivo ya lo tiene un técnico (el cliente pagó)
const cuentaParaSaldo = m => m.estado !== 'anulado' && (DEBE(m.tipo) || m.tipo === 'credito' || m.estado === 'ok' || m.estado === 'a_rendir');

// saldo de la cuenta inmediatamente después de un movimiento (orden cronológico)
function saldoHasta(mov) {
  const ms = movsDe(mov.plagas_cliente_id).slice().sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.created_at || '').localeCompare(b.created_at || ''));
  let s = 0; for (const m of ms) { if (cuentaParaSaldo(m)) s += DEBE(m.tipo) ? +m.importe : -m.importe; if (m === mov) break; } return s;
}
function cuentaDe(pc) {
  return D.cuentas.find(c => c.plagas_cliente_id === pc) || { plagas_cliente_id: pc, condicion: 'contado', modalidad: 'por_visita', abono_mensual: 0, precio_visita: 0, plazo_dias: 0, _nueva: true };
}
const movsDe = pc => D.movs.filter(m => m.plagas_cliente_id === pc);

function cuentaEstado(pc) {
  const ms = movsDe(pc).filter(m => m.estado !== 'anulado');
  let debe = 0, haber = 0;
  ms.forEach(m => { if (!cuentaParaSaldo(m)) return; if (DEBE(m.tipo)) debe += +m.importe; else haber += +m.importe; });
  const aVerif = sumar(ms.filter(m => m.estado === 'a_verificar'));
  // imputación FIFO: el haber cubre primero los cargos que vencen antes
  let resto = haber; const impagos = [];
  ms.filter(m => DEBE(m.tipo)).sort((a, b) => (a.vence || a.fecha).localeCompare(b.vence || b.fecha) || (a.created_at || '').localeCompare(b.created_at || '')).forEach(m => {
    const imp = +m.importe, cub = Math.min(resto, imp); resto -= cub;
    if (imp - cub > 0.004) impagos.push({ m, pend: imp - cub, dias: -daysTo(m.vence || m.fecha) });
  });
  const tramos = { al_dia: 0, d30: 0, d60: 0, d90: 0, mas: 0 };
  impagos.forEach(x => { const d = x.dias; tramos[d <= 0 ? 'al_dia' : d <= 30 ? 'd30' : d <= 60 ? 'd60' : d <= 90 ? 'd90' : 'mas'] += x.pend; });
  const venc = impagos.filter(x => x.dias > 0);
  const pagos = ms.filter(m => m.tipo === 'pago' && cuentaParaSaldo(m)).sort((a, b) => b.fecha.localeCompare(a.fecha));
  return { saldo: debe - haber, debe, haber, aVerif, impagos, tramos, vencido: sumar(venc, x => x.pend),
    maxDias: venc.reduce((m, x) => Math.max(m, x.dias), 0), ultPago: pagos[0] || null, proximo: impagos.find(x => x.dias <= 0) || null };
}
function resumenCobranzas() {
  const r = { saldo: 0, vencido: 0, nVenc: 0, tramos: { al_dia: 0, d30: 0, d60: 0, d90: 0, mas: 0 } };
  D.clientes.forEach(c => { const e = cuentaEstado(c.id); r.saldo += Math.max(0, e.saldo); r.vencido += e.vencido; if (e.vencido > 0) r.nVenc++; Object.keys(r.tramos).forEach(k => r.tramos[k] += e.tramos[k]); });
  return r;
}
// visitas cerradas que todavía no tienen su cargo (clientes por visita, o extraordinarias de clientes con abono)
function serviciosSinCargar() {
  const hechas = new Set(D.movs.filter(m => m.visita_id && DEBE(m.tipo) && m.estado !== 'anulado').map(m => m.visita_id));
  return D.visitas.filter(v => {
    if (v.estado !== 'cerrada' || hechas.has(v.id)) return false;
    const k = cuentaDe(v.plagas_cliente_id); if (k._nueva) return false;
    if ((v.fin || v.fecha_programada).slice(0, 10) < (k.cobrar_desde || '0000')) return false;
    return k.modalidad === 'por_visita' || v.tipo === 'extraordinaria';
  }).sort((a, b) => (a.fin || a.fecha_programada).localeCompare(b.fin || b.fecha_programada));
}
function abonosPendientes(per = HOY.slice(0, 7)) {
  return D.cuentas.filter(k => k.modalidad === 'abono' && +k.abono_mensual > 0 && (byId(D.clientes, k.plagas_cliente_id) || {}).activo !== false
    && per >= (k.cobrar_desde || '0000').slice(0, 7)
    && !D.movs.some(m => m.plagas_cliente_id === k.plagas_cliente_id && m.origen === 'abono' && m.periodo === per && m.estado !== 'anulado'));
}
function cobPendientes() {
  return serviciosSinCargar().length + abonosPendientes().length + D.movs.filter(m => m.estado === 'a_rendir' || m.estado === 'a_verificar').length;
}
function pillDias(d) { return d > 0 ? `<span class="pill ${d > 60 ? 'p-bad' : 'p-warn'}">${d} día${d === 1 ? '' : 's'} de atraso</span>` : '<span class="pill p-ok">Al día</span>'; }
function barraTramos(t) {
  const tot = Object.values(t).reduce((s, n) => s + n, 0);
  if (tot <= 0.004) return '<p class="small muted" style="margin:0">No hay saldos pendientes.</p>';
  return `<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)">${TRAMOS.map(([k, , c]) => t[k] > 0 ? `<div title="${fmt$(t[k])}" style="width:${t[k] / tot * 100}%;background:${c}"></div>` : '').join('')}</div>
    <div class="legend">${TRAMOS.map(([k, l, c]) => `<span><i style="background:${c}"></i>${l}: <b style="color:var(--ink)">${fmt$(t[k])}</b></span>`).join('')}</div>`;
}
