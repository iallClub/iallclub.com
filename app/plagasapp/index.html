<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlagasApp · iall Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#10201C; --muted:#55635F; --faint:#8B9894; --line:#DCE2E0; --soft:#EEF3F1;
  --acc:#3FE0A8; --acc-ink:#06231B; --acc-dk:#0A6B50; --acc-bg:#E3F7EE;
  --warn:#F2A93B; --warn-ink:#8A5300; --warn-bg:#FFF1D6;
  --bad:#D64545; --bad-bg:#FDE7E7; --blue:#2F7FD1;
  --r:18px; --mono:'JetBrains Mono',ui-monospace,monospace; --disp:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc-dk)}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.4px;margin:0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .small{font-size:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}

/* layout */
#app{min-height:100vh;display:flex}
.rail{display:none}
.main{flex:1;min-width:0;padding:20px 16px 110px;max-width:1180px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.brand-t{display:flex;flex-direction:column;min-width:0}
.brand-t b{font-family:var(--disp);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:4px;background:currentColor;display:inline-block}
.p-ok{background:var(--acc-bg);color:var(--acc-dk)} .p-warn{background:var(--warn-bg);color:var(--warn-ink)}
.p-bad{background:var(--bad-bg);color:#9B2323} .p-mut{background:var(--soft);color:var(--muted)} .p-ink{background:var(--ink);color:#fff}

/* bottom nav (mobile) */
.bnav{position:fixed;left:12px;right:12px;bottom:12px;background:#fff;border-radius:26px;padding:8px;display:grid;gap:4px;box-shadow:0 10px 30px rgba(16,32,28,.12);z-index:20}
.bnav a{height:54px;border-radius:18px;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px}
.bnav a.on{background:var(--ink);color:#fff}
.bnav a.on svg{stroke:var(--acc)}
@media (min-width:900px){
  .bnav{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;width:236px;flex:none;background:var(--ink);color:#fff;margin:16px 0 16px 16px;border-radius:28px;padding:22px 14px;position:sticky;top:16px;height:calc(100vh - 32px)}
  .rail .rb{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
  .rail a{height:46px;border-radius:14px;padding:0 12px;display:flex;align-items:center;gap:10px;color:#C9D4D0;text-decoration:none;font-size:14px}
  .rail a.on{background:#fff;color:var(--ink)}
  .rail a .bd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--acc)}
  .rail a.on .bd{color:var(--acc-dk)}
  .main{padding:24px 28px 40px}
}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px}
.dark{background:var(--ink);color:#fff;border-radius:24px;padding:20px}
.dark .muted{color:#9FB3AD}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--disp);font-size:30px;letter-spacing:-1px;font-weight:600}
.kpi.ink{background:var(--ink);color:#fff} .kpi.ink .muted{color:#9FB3AD}
.kpi.w{background:var(--warn-bg);color:#5C3800}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-h h2{font-size:18px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border-radius:18px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .tx b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .tx span{font-size:12px;color:var(--muted)}
.tag{width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--acc-dk);flex:none;text-align:center;line-height:1.1}
.sep{border-top:1px solid #EEF1F0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:#fff;border-radius:18px;font-size:14px}

/* buttons */
.btn{height:46px;padding:0 18px;border-radius:15px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-family:var(--disp);font-weight:600}
.btn.bad{color:#9B2323;border-color:#F3C3C3}
.btn.sm{height:38px;padding:0 12px;border-radius:12px;font-size:13px}
.btn.big{height:56px;border-radius:18px;font-size:15px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* forms / modal */
.ov{position:fixed;inset:0;background:rgba(16,32,28,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px 24px}
@media (min-width:640px){ .ov{align-items:center;padding:20px} .modal{border-radius:28px} }
.modal h3{font-size:20px;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 12px;width:100%}
.fld textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.fld input[type=file]{padding:10px}
.fld .hint{font-size:12px;color:var(--muted)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:80;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1} .toast.err{background:#9B2323}
@media (min-width:900px){.toast{bottom:28px}}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid #EEF1F0;vertical-align:middle}
.tblw{overflow-x:auto;background:#fff;border-radius:18px;padding:6px}

/* map */
.map{position:relative;background:#fff;border-radius:24px;overflow:hidden;min-height:240px;background-image:radial-gradient(#D5DDDA 1px,transparent 1px);background-size:14px 14px}
.map img{width:100%;display:block;opacity:.92}
.map.pick{cursor:crosshair;outline:3px dashed var(--acc)}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:14px;border:2px solid #fff;font-family:var(--mono);font-size:9px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:5px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:5px;height:46px}
.bars div{flex:1;border-radius:4px}

/* técnico */
.prog{display:grid;gap:3px}
.prog div{height:6px;border-radius:3px;background:var(--line)}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.st{height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.st.cur{outline:3px solid var(--acc);outline-offset:1px}
.states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sbtn{height:62px;border-radius:18px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;padding:0 14px;text-align:left}
.sbtn i{width:12px;height:12px;border-radius:6px;flex:none}
.sbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sig{width:100%;height:170px;background:#fff;border:1px dashed #B9C4C0;border-radius:16px;touch-action:none;display:block}
.demo-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px dashed #B9C4C0;border-radius:16px;padding:8px 10px;margin-bottom:14px;font-size:12px}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);flex-direction:column;gap:10px}
.spin{width:26px;height:26px;border-radius:13px;border:3px solid var(--line);border-top-color:var(--ink);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
video.qr{width:100%;border-radius:18px;background:#000}
@media print{ .bnav,.rail,.demo-bar{display:none} }
</style>
</head>
<body>
<div id="app"><div class="main"><div class="loading"><div class="spin"></div>Cargando PlagasApp…</div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   PlagasApp · iall Club
   Módulo para empresas de control de plagas.
   Perfiles: admin · tecnico · cliente  (tabla plagas_perfiles)
   Seguridad: RLS en Supabase + JWT de la sesión de iall Club.
   v0.1 sin fotos: firma como SVG en la tabla, certificados e
   informes generados en el navegador (no ocupan Storage).
   ============================================================ */
const BUILD = '2026-10-17a';
const SUPABASE_URL = 'https://smldkvlmmzlgpxrtfesz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HGeSd7TgEqn53VUrltY-Tg_OW_ERXQ8';
const BUCKET = 'plagas';

const qs = new URLSearchParams(location.search);
const CID = qs.get('cid') || '';
let DEMO = !CID || CID === 'admin' || qs.get('demo') === '1';
let sb = null, SESSION_EMAIL = '';

let ROLE = 'admin';          // admin | tecnico | cliente
let ME = null;               // fila de plagas_perfiles del usuario
let EMP = {};                // datos de la empresa (tabla clientes de iall Club)
let VIEW = '';
let CTX = { filtro:'todo', agenda:'proximas', cli:null, cliTab:'datos', visita:null, est:null, mapEst:null, pick:null };
const D = { clientes:[], perfiles:[], asign:[], docs:[], productos:[], planos:[], estaciones:[], visitas:[], hallazgos:[], informes:[], pedidos:[] };
const CACHE = { mon:{}, apl:{} };   // monitoreos / aplicaciones por visita (carga diferida)

console.log('%cPlagasApp BUILD ' + BUILD, 'color:#0A6B50;font-weight:bold', { CID, DEMO });

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const HOY = isoDate(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const fmtD = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '—';
const fmtDT = ts => ts ? new Date(ts).toLocaleString('es-AR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const daysTo = iso => iso ? Math.round((new Date(iso + 'T12:00:00') - new Date(HOY + 'T12:00:00')) / 86400000) : null;
const byId = (arr, id) => arr.find(x => String(x.id) === String(id));
const cliName = id => (byId(D.clientes, id) || {}).razon_social || '—';
const perName = id => (byId(D.perfiles, id) || {}).nombre || '—';
const DIAS = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'], MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', err ? 5000 : 2800);
}
function errMsg(e) { return (e && (e.message || e.error_description || e.details)) || String(e); }

const CATS = { habilitacion:'Habilitación', director_tecnico:'Director técnico', seguro:'Seguros / ART', capacitacion:'Capacitación del personal',
  ficha_tecnica:'Ficha técnica', fds:'Hoja de seguridad (FDS)', registro_producto:'Registro de producto', contrato:'Contrato',
  programa_mip:'Programa MIP', carnet:'Carnet de aplicador', otro:'Otro' };
const CAT_TAG = { habilitacion:'HAB', director_tecnico:'DT', seguro:'ART', capacitacion:'CAP', ficha_tecnica:'FT', fds:'FDS', registro_producto:'REG', contrato:'CTO', programa_mip:'MIP', carnet:'CRN', otro:'DOC' };
const GRUPOS = { todo:null, habilitaciones:['habilitacion','director_tecnico'], personal:['seguro','capacitacion','carnet'], productos:['ficha_tecnica','fds','registro_producto'], cliente:['contrato','programa_mip','otro'] };
const EST = {
  sin_actividad:{ l:'Sin actividad', c:'#10201C', f:'#fff' },
  consumo:      { l:'Consumo',       c:'#F2A93B', f:'#2A1A00' },
  captura:      { l:'Captura',       c:'#D64545', f:'#fff' },
  danada:       { l:'Dañada',        c:'#2F7FD1', f:'#fff' },
  faltante:     { l:'Faltante',      c:'#8B9894', f:'#fff' },
  reemplazada:  { l:'Reemplazada',   c:'#3FE0A8', f:'#06231B' }
};
const TIPO_EST = { ecc:'Estación de cebo', trampa_fisica:'Trampa física', lampara_uv:'Lámpara UV', monitoreo_rastreros:'Monitoreo rastreros' };
const ESTADO_VIS = { programada:['Programada','p-mut'], en_curso:['En curso','p-ok'], cerrada:['Cerrada','p-ink'], anulada:['Anulada','p-bad'] };

function semaforo(vence) {
  const d = daysTo(vence);
  if (d === null) return { t:'Sin venc.', k:'p-mut', n:0 };
  if (d < 0) return { t:'Vencido', k:'p-bad', n:2 };
  if (d <= 30) return { t: d + ' días', k:'p-warn', n:1 };
  return { t:'Vigente', k:'p-ok', n:0 };
}

/* ---------- íconos ---------- */
const I = {
  shield:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/>',
  check:'<path d="M9 12l2 2 4-4"/>',
  down:'<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  cert:'<circle cx="12" cy="9" r="5"/><path d="M9 13l-2 8 5-3 5 3-2-8"/>',
  doc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  map:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c1-4 4-6 7-6s6 2 7 6"/><path d="M16 4a3.5 3.5 0 010 7M18 14c2 1 3.5 3 4 6"/>',
  build:'<path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/>',
  flask:'<path d="M9 3h6v5l4 9a2 2 0 01-2 3H7a2 2 0 01-2-3l4-9z"/><path d="M7 14h10"/>',
  qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-7"/>',
  pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  id:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 10h4M14 14h3"/>',
  alert:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  zip:'<path d="M6 3h9l4 4v14H6z"/><path d="M11 7h2M11 10h2M11 13h2v3h-2z"/>'
};
const ic = (n, s = 18, col = 'currentColor', w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ============================================================
   CAPA DE DATOS — Supabase (con RLS) o memoria en modo demo
   ============================================================ */
const TBL = { clientes:'plagas_clientes', perfiles:'plagas_perfiles', asign:'plagas_asignaciones', docs:'plagas_documentos',
  productos:'plagas_productos', planos:'plagas_planos', estaciones:'plagas_estaciones', visitas:'plagas_visitas',
  hallazgos:'plagas_hallazgos', informes:'plagas_informes', pedidos:'plagas_pedidos', mon:'plagas_monitoreos', apl:'plagas_aplicaciones' };
const MEM = {};   // tablas en memoria (demo)
// valores por defecto que en Supabase pone la base (DEFAULT de cada columna)
const DEMO_DEFAULTS = { visitas: { estado: 'programada', tipo: 'programada' }, pedidos: { estado: 'nuevo', tipo: 'avistamiento' },
  hallazgos: { estado: 'abierto', prioridad: 'media' }, estaciones: { activa: true, tipo: 'ecc', interior: false }, clientes: { activo: true, frecuencia: 'mensual' },
  perfiles: { activo: true }, productos: { activo: true }, planos: { vigente: true, revision: 1 }, informes: { estado: 'borrador' } };

async function dbSelect(key, filt = {}, order) {
  if (DEMO) {
    let r = (MEM[key] || []).filter(x => Object.entries(filt).every(([k, v]) => Array.isArray(v) ? v.includes(x[k]) : x[k] === v));
    return r.map(x => ({ ...x }));
  }
  let q = sb.from(TBL[key]).select('*');
  for (const [k, v] of Object.entries(filt)) q = Array.isArray(v) ? q.in(k, v) : q.eq(k, v);
  if (order) q = q.order(order[0], { ascending: order[1] !== false });
  const { data, error } = await q;
  if (error) throw error;
  return data || [];
}
async function dbInsert(key, row) {
  row = { cliente_id: CID || 'demo', ...row };
  if (DEMO) {
    const r = { id: uid(), created_at: new Date().toISOString(), ...(DEMO_DEFAULTS[key] || {}), ...row };
    if (key === 'estaciones' && !r.qr_token) r.qr_token = Math.random().toString(16).slice(2, 14);
    if (key === 'informes') r.id = r.visita_id;
    (MEM[key] = MEM[key] || []).push(r); return { ...r };
  }
  const { data, error } = await sb.from(TBL[key]).insert(row).select().single();
  if (error) throw error; return data;
}
async function dbUpdate(key, id, patch, col = 'id') {
  if (DEMO) {
    const r = (MEM[key] || []).find(x => String(x[col]) === String(id));
    if (!r) throw new Error('No encontrado');
    if (key === 'visitas') demoVisitaTrigger(r, patch);
    Object.assign(r, patch); return { ...r };
  }
  const { data, error } = await sb.from(TBL[key]).update(patch).eq(col, id).select();
  if (error) throw error;
  if (!data || !data.length) throw new Error('Sin permiso para modificar este registro');
  return data[0];
}
async function dbDelete(key, id, col = 'id') {
  if (DEMO) { MEM[key] = (MEM[key] || []).filter(x => String(x[col]) !== String(id)); return; }
  const { error } = await sb.from(TBL[key]).delete().eq(col, id);
  if (error) throw error;
}
async function dbUpsert(key, row, onConflict) {
  row = { cliente_id: CID || 'demo', ...row };
  if (DEMO) {
    const cols = onConflict.split(',');
    const ex = (MEM[key] = MEM[key] || []).find(x => cols.every(c => String(x[c]) === String(row[c])));
    if (ex) { Object.assign(ex, row); return { ...ex }; }
    return dbInsert(key, row);
  }
  const { data, error } = await sb.from(TBL[key]).upsert(row, { onConflict }).select().single();
  if (error) throw error; return data;
}
// Emula en demo los triggers de la base (numeración de certificado y carnet)
function demoVisitaTrigger(old, patch) {
  if (old.estado === 'cerrada' && ROLE !== 'admin') throw new Error('La visita está cerrada. Sólo el administrador puede reabrirla.');
  const nuevo = { ...old, ...patch };
  if (nuevo.estado === 'cerrada' && !nuevo.certificado_numero) {
    const y = new Date().getFullYear();
    const n = (MEM.visitas || []).map(v => v.certificado_numero || '').filter(c => c.startsWith('CS-' + y)).map(c => +c.split('-')[2]).reduce((a, b) => Math.max(a, b), 0) + 1;
    patch.certificado_numero = `CS-${y}-${String(n).padStart(4, '0')}`;
    patch.fin = patch.fin || new Date().toISOString();
    const t = byId(MEM.perfiles, nuevo.tecnico_id) || {};
    patch.tecnico_nombre = t.nombre; patch.tecnico_carnet = t.carnet_numero;
  }
}

/* ---------- Storage (bucket privado, URLs firmadas) ---------- */
async function subirArchivo(file, carpeta) {
  if (!file) return null;
  if (file.size > 5 * 1024 * 1024) throw new Error('El archivo supera 5 MB. Comprimilo antes de subirlo.');
  if (DEMO) return { path: 'demo/' + file.name, size: file.size };
  const limpio = file.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_');
  const path = `${CID}/${carpeta}/${Date.now()}_${limpio}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert: false, contentType: file.type });
  if (error) throw error;
  return { path, size: file.size };
}
async function urlFirmada(path, segundos = 120) {
  if (!path) return null;
  if (DEMO) return null;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, segundos);
  if (error) throw error; return data.signedUrl;
}
async function descargarDoc(id) {
  const d = byId(D.docs, id);
  if (!d || !d.storage_path) return toast('Este documento no tiene archivo adjunto', true);
  if (DEMO) return toast('Modo demo: los archivos no se guardan');
  try { const u = await urlFirmada(d.storage_path); window.open(u, '_blank', 'noopener'); }
  catch (e) { toast('No se pudo abrir: ' + errMsg(e), true); }
}

async function boot() {
  try {

      const { data: { session } } = await sb.auth.getSession();
      if (!session) return pantallaMensaje('Sesión no encontrada', 'Ingresá a iall Club y abrí PlagasApp desde Módulos.');
      SESSION_EMAIL = (session.user.email || '').toLowerCase();
      const [{ data: per }, { data: emp }] = await Promise.all([

      ]);

        if (u && u[0] && u[0].rol === 'superadmin') ME = { id: null, nombre: 'Superadmin iall Club', perfil: 'admin', email: SESSION_EMAIL };
      }

async function monitoreosDe(visitaIds) {

    rows.forEach(r => (CACHE.mon[r.visita_id] = CACHE.mon[r.visita_id] || []).push(r));
  }
  return visitaIds.flatMap(id => CACHE.mon[id] || []);
}

/* ---------- modal y formularios ---------- */
function modal(titulo, html, acciones = []) {
  cerrarModal();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><h3>${titulo}</h3><div id="mbody">${html}</div>
    <div class="mact">${acciones.map((a, i) => `<button class="btn ${a.cls || ''}" data-i="${i}">${a.label}</button>`).join('')}</div></div>`;
  ov.addEventListener('click', e => { if (e.target === ov) cerrarModal(); });
  ov.querySelectorAll('.mact button').forEach(b => b.onclick = async () => {
    const a = acciones[+b.dataset.i]; if (!a.fn) return cerrarModal();
    b.disabled = true;
    try { const r = await a.fn(); if (r !== false) cerrarModal(); }
    catch (e) { console.error(e); toast(errMsg(e), true); }
    finally { b.disabled = false; }
  });
  document.body.appendChild(ov);
  const f = ov.querySelector('input,select,textarea'); if (f && window.innerWidth > 640) f.focus();
  return ov;
}
function cerrarModal() { const o = $('#ov'); if (o) o.remove(); }
const CANCEL = { label: 'Cancelar' };

function form(fields) {
  return fields.map(f => {
    const id = 'f_' + f.k, req = f.req ? ' required' : '', v = f.value ?? '';
    let input;
    if (f.type === 'select') input = `<select id="${id}"${req}>${f.options.map(([ov, ol]) => `<option value="${esc(ov)}"${String(ov) === String(v) ? ' selected' : ''}>${esc(ol)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea id="${id}"${req}>${esc(v)}</textarea>`;
    else if (f.type === 'file') input = `<input type="file" id="${id}" accept="${f.accept || 'application/pdf,image/*'}">`;
    else input = `<input type="${f.type || 'text'}" id="${id}" value="${esc(v)}"${req}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}${f.step ? ` step="${f.step}"` : ''}>`;
    return `<div class="fld" id="w_${f.k}"${f.hide ? ' style="display:none"' : ''}><label for="${id}">${f.label}${f.req ? ' *' : ''}</label>${input}${f.hint ? `<span class="hint">${f.hint}</span>` : ''}</div>`;
  }).join('');
}
function leer(fields) {
  const o = {};
  for (const f of fields) {
    const el = document.getElementById('f_' + f.k); if (!el) continue;
    if (f.type === 'file') { o[f.k] = el.files[0] || null; continue; }
    let v = el.value.trim();
    if (f.req && !v && el.closest('.fld').style.display !== 'none') { el.focus(); throw new Error(`Completá: ${f.label}`); }
    if (f.type === 'number') v = v === '' ? null : Number(v);
    o[f.k] = v === '' ? null : v;
  }
  return o;
}

/* ---------- carpeta de auditoría (ZIP) ---------- */
async function carpetaAuditoria() {
  if (!window.JSZip) return toast('No se pudo cargar el compresor ZIP', true);
  toast('Armando la carpeta…');
  try {
    const zip = new JSZip(), pc = ME.plagas_cliente_id, nombre = cliName(pc);
    const docs = docsVisiblesCliente().filter(d => d.storage_path && semaforo(d.vence).n !== 2);
    let ok = 0;
    for (const d of docs) {
      if (DEMO) { zip.file(`01_Empresa/${d.nombre}.txt`, 'Modo demo: archivo de ejemplo'); continue; }
      try { const u = await urlFirmada(d.storage_path); const b = await (await fetch(u)).blob();
        const ext = (d.storage_path.split('.').pop() || 'pdf').toLowerCase();
        zip.file(`${d.alcance === 'cliente' ? '02_Contrato' : '01_Empresa'}/${CATS[d.categoria] || 'Otro'} - ${d.nombre}.${ext}`.replace(/[\\:*?"<>|]/g, '_'), b); ok++; } catch (_) {}
    }
    const desde = addDays(HOY, -365);
    const vs = D.visitas.filter(v => v.plagas_cliente_id === pc && v.estado === 'cerrada' && (v.fin || '').slice(0, 10) >= desde);
    for (const v of vs) zip.file(`03_Certificados/${v.certificado_numero || v.id}.pdf`, await pdfCertificado(v.id, true));
    for (const i of D.informes.filter(i => i.plagas_cliente_id === pc && i.estado === 'publicado')) {
      const v = byId(D.visitas, i.visita_id); if (!v || (v.fecha_programada < desde)) continue;
      zip.file(`04_Informes/Informe ${v.fecha_programada}.pdf`, await pdfInforme(i.visita_id, true));
    }
    const plano = D.planos.filter(p => p.plagas_cliente_id === pc && p.vigente).sort((a, b) => b.revision - a.revision)[0];
    if (plano && plano.storage_path && !DEMO) { try { const b = await (await fetch(await urlFirmada(plano.storage_path))).blob(); zip.file(`05_Plano/Plano rev ${plano.revision}.${plano.storage_path.split('.').pop()}`, b); } catch (_) {} }
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Carpeta auditoria - ${nombre} - ${HOY}.zip`.replace(/[\\/:*?"<>|]/g, '_');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(`Carpeta lista: ${ok + (DEMO ? docs.length : 0)} documentos, ${vs.length} certificados`);
  } catch (e) { toast('Error armando la carpeta: ' + errMsg(e), true); }
}

/* ---------- cierre de visita con firma ---------- */
let FIRMA = [];
function cerrarVisita() {
  const v = byId(D.visitas, CTX.visita);
  const est = D.estaciones.filter(e => e.plagas_cliente_id === v.plagas_cliente_id && e.activa);
  const mon = CACHE.mon[v.id] || [], falt = est.length - est.filter(e => mon.find(m => m.estacion_id === e.id)).length;
  FIRMA = [];
  const F = [{ k: 'observaciones', label: 'Observaciones del servicio', type: 'textarea', value: v.observaciones || '' }, { k: 'firma_nombre', label: 'Nombre de quien recibe el servicio', req: true }];
  modal('Cerrar visita', `${falt ? `<div class="card" style="background:var(--warn-bg);color:#5C3800;margin-bottom:12px">Faltan ${falt} estaciones sin registrar. Podés cerrar igual: quedan como no controladas.</div>` : ''}
    ${form(F)}<div class="fld"><label>Firma</label><canvas id="sig" class="sig" width="600" height="240"></canvas>
    <button class="btn sm" style="align-self:flex-start" onclick="FIRMA=[];pintarFirma()">Borrar firma</button></div>`,
    [CANCEL, { label: 'Cerrar y generar certificado', cls: 'ink', fn: async () => {
      const o = leer(F);
      if (!FIRMA.some(t => t.length > 1)) throw new Error('Falta la firma de quien recibe el servicio');
      const cnt = contarEstados(mon);
      const resumen = `Se controlaron ${mon.length} de ${est.length} estaciones. ` + Object.entries(cnt).map(([k, n]) => `${EST[k].l}: ${n}`).join(', ') + '.'
        + ((CACHE.apl[v.id] || []).length ? ` Se aplicaron ${(CACHE.apl[v.id] || []).length} producto(s).` : '')
        + (D.hallazgos.filter(h => h.visita_id === v.id).length ? ` Se registraron ${D.hallazgos.filter(h => h.visita_id === v.id).length} hallazgo(s).` : '');
      if (!D.informes.find(i => i.visita_id === v.id)) D.informes.push(await dbInsert('informes', { visita_id: v.id, plagas_cliente_id: v.plagas_cliente_id, resumen, estado: 'borrador' }));
      const up = await dbUpdate('visitas', v.id, { estado: 'cerrada', observaciones: o.observaciones, firma_nombre: o.firma_nombre, firma_svg: firmaSVG(), fin: new Date().toISOString() });
      Object.assign(v, up);
      setTimeout(() => modal('Visita cerrada', `<p>Certificado <b class="mono">${esc(v.certificado_numero || '')}</b> generado. El informe quedó en borrador para que el administrador lo revise y publique.</p>`,
        [{ label: 'Listo' }, { label: ic('down', 15) + 'Certificado', cls: 'ink', fn: () => pdfCertificado(v.id) }]), 50);
      CTX.visita = null; go('hoy');
    } }]);
  const c = $('#sig'), ctx = c.getContext('2d');
  const pos = e => { const r = c.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 300), Math.round((e.clientY - r.top) / r.height * 120)]; };
  let on = false;
  c.addEventListener('pointerdown', e => { on = true; c.setPointerCapture(e.pointerId); FIRMA.push([pos(e)]); });
  c.addEventListener('pointermove', e => { if (!on) return; FIRMA[FIRMA.length - 1].push(pos(e)); pintarFirma(); });
  c.addEventListener('pointerup', () => on = false);
  window.pintarFirma = () => { ctx.clearRect(0, 0, 600, 240); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#10201C';
    FIRMA.forEach(t => { ctx.beginPath(); t.forEach(([x, y], i) => i ? ctx.lineTo(x * 2, y * 2) : ctx.moveTo(x * 2, y * 2)); ctx.stroke(); }); };
}
function firmaSVG() {
  const d = FIRMA.filter(t => t.length > 1).map(t => 'M' + t.map(p => p.join(' ')).join('L')).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120"><path d="${d}" fill="none" stroke="#10201C" stroke-width="2" stroke-linecap="round"/></svg>`;
}
function trazosDeSVG(svg) {
  const m = /d="([^"]*)"/.exec(svg || ''); if (!m) return [];
  return m[1].split('M').filter(Boolean).map(s => s.split('L').map(p => p.trim().split(/\s+/).map(Number)));
}

/* ---------- escaneo de QR (BarcodeDetector, Chrome Android) ---------- */
async function escanearQR() {
  if (!('BarcodeDetector' in window)) return toast('Este celular no permite escanear desde la app. Tocá la estación en la grilla.', true);
  let stream;
  const ov = modal('Escanear estación', '<video class="qr" id="qrv" playsinline muted></video><p class="small muted">Apuntá al código QR de la estación.</p>', [{ label: 'Cancelar', fn: () => { stream && stream.getTracks().forEach(t => t.stop()); } }]);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const vid = $('#qrv'); vid.srcObject = stream; await vid.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const v = byId(D.visitas, CTX.visita);
    const loop = async () => {
      if (!document.body.contains(ov)) { stream.getTracks().forEach(t => t.stop()); return; }
      const codes = await det.detect(vid).catch(() => []);
      const raw = codes[0] && codes[0].rawValue;
      if (raw) {
        const tok = raw.replace(/^PLG:/, '');
        const e = D.estaciones.find(x => x.plagas_cliente_id === v.plagas_cliente_id && (x.qr_token === tok || x.codigo === tok));
        if (e) { stream.getTracks().forEach(t => t.stop()); cerrarModal(); CTX.est = e.id; render(); toast('Estación ' + e.codigo); return; }
        toast('Ese QR no es de este cliente', true);
      }
      setTimeout(loop, 250);
    };
    loop();
  } catch (e) { toast('No se pudo abrir la cámara: ' + errMsg(e), true); }
}

    { k: 'repetir', label: 'Repetir', type: 'select', hide: !!v, options: [['0', 'No repetir'], ['7', 'Semanal (12 semanas)'], ['14', 'Quincenal (6 meses)'], ['30', 'Mensual (12 meses)']] }];
  modal(v ? 'Editar visita' : 'Programar visita', (ped ? `<div class="card" style="margin-bottom:12px"><b>Pedido:</b> ${esc(ped.descripcion)}</div>` : '') + form(F), [CANCEL, { label: 'Guardar', cls: 'ink', fn: async () => {
